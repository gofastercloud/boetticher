---
# boetticher managed-appliance runtime configuration entry point.
# Runtime credentials are intentionally not represented in this playbook.
- name: Install the Core bridge boundary before appliance work
  hosts: proxmox
  become: false
  gather_facts: false
  roles:
    - role: network-isolation-host
      when:
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
        - firewall_plan.mode == 'managed'

- name: Configure managed appliance runtime state
  hosts: managed
  # Deployment connects as the temporary root SSH identity installed during
  # bootstrap. Durable labadmin has no sudo or become boundary.
  become: false
  gather_facts: false
  roles:
    - role: firewall
      when:
        - inventory_hostname in groups.get('firewall', [])
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
        - not (boetticher_skip_firewall | default(false) | bool)
    - base
    - role: chrony
      when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
    - role: tailnet-router
      when:
        - inventory_hostname in groups.get('tailnet-router', [])
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Reconcile Core-owned USB exports after appliance configuration
  hosts: proxmox
  become: false
  gather_facts: false
  roles:
    - role: usb-export-host
      when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
            and not (boetticher_network_isolation_only | default(false) | bool)
