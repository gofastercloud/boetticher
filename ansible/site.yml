---
# boetticher managed-appliance runtime configuration entry point.
# Runtime credentials are intentionally not represented in this playbook.
- name: Configure managed appliance runtime state
  hosts: managed
  become: true
  gather_facts: true
  roles:
    - base
    - chrony
    - role: dns
      when: inventory_hostname in groups.get('dns', [])
    - role: monitor
      when: inventory_hostname in groups.get('monitor', [])
    - role: logging
      when: inventory_hostname in logging_upload_configs or inventory_hostname == 'lab-log-01'
    - role: firewall
      when: inventory_hostname in groups.get('firewall', [])
    - role: portal
      when: inventory_hostname == 'lab-portal-01'
    - role: tailnet-router
      when: inventory_hostname in groups.get('tailnet-router', [])
    - role: litellm
      when: inventory_hostname in groups.get('litellm', [])
