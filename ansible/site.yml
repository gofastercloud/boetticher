---
# boetticher managed-appliance runtime configuration entry point.
# Runtime credentials are intentionally not represented in this playbook.
- name: Install the Core bridge boundary before appliance work
  hosts: proxmox
  become: false
  gather_facts: false
  roles:
    - role: network-isolation-host
      when:
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
        - firewall_plan.mode == 'managed'

- name: Prepare the AirVPN host time base before managed appliance configuration
  hosts: airvpn
  become: false
  gather_facts: false
  roles:
    - role: chrony
      when: boetticher_deploy_phase | default('full') in ['full', 'services']

- name: Configure managed appliance runtime state
  hosts: managed
  # Deployment connects as the temporary root SSH identity installed during
  # bootstrap. Durable labadmin has no sudo or become boundary.
  become: false
  gather_facts: false
  roles:
    - role: firewall
      when:
        - inventory_hostname in groups.get('firewall', [])
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
        - not (boetticher_skip_firewall | default(false) | bool)
    - base
    - role: chrony
      when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
    - role: dns
      when:
        - inventory_hostname in groups.get('dns', [])
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
    - role: monitor
      when: inventory_hostname in groups.get('monitor', [])
    - role: logging
      when: inventory_hostname in logging_upload_configs or inventory_hostname == 'lab-log-01'
    - role: tailnet-router
      when:
        - inventory_hostname in groups.get('tailnet-router', [])
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
    - role: airvpn
      when:
        - inventory_hostname in groups.get('airvpn', [])
        - boetticher_deploy_phase | default('full') in ['full', 'bootstrap', 'services']
    - role: airvpn-client
      when: inventory_hostname in (airvpn_selected_guests | default([]))
    - role: bifrost
      when: inventory_hostname in groups.get('bifrost', [])
    - role: printer
      when: inventory_hostname in groups.get('printer', [])
    - role: arr
      when: inventory_hostname in groups.get('arr', [])
    - role: aiops
      when: inventory_hostname in groups.get('aiops', [])
    - role: gatus
      when: inventory_hostname in groups.get('gatus', [])

- name: Reconcile Core-owned USB exports after appliance configuration
  hosts: proxmox
  become: false
  gather_facts: false
  roles:
    - role: usb-export-host
      when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
            and not (boetticher_network_isolation_only | default(false) | bool)
    - role: network-probe-host
      when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
            and not (boetticher_network_isolation_only | default(false) | bool)
