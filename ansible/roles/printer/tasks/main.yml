---
- name: Require the immutable printer appliance and serial export
  ansible.builtin.assert:
    that:
      - boetticher_appliance_artifact | default(false) | bool
      - module_configs.printer is defined
      - usb_export_manifests | selectattr('vmid', 'equalto', 230) | list | length == 1
      - ((usb_export_manifests | selectattr('vmid', 'equalto', 230) | first).exports | length) == 1
      - ((usb_export_manifests | selectattr('vmid', 'equalto', 230) | first).exports | first).device_type == 'serial'
    fail_msg: Printer management requires its qualified appliance and validated serial export

- name: Prepare persistent OctoPrint state
  ansible.builtin.file:
    path: /var/lib/octoprint
    state: directory
    owner: octoprint
    group: octoprint
    mode: '0700'

- name: Create the printer TLS identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate the printer endpoint private key locally
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, /var/lib/boetticher/identity/tls/octoprint.key.pem]
  args:
    creates: /var/lib/boetticher/identity/tls/octoprint.key.pem

- name: Restrict the printer endpoint private key
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls/octoprint.key.pem
    owner: root
    group: root
    mode: '0600'

- name: Require Smallstep printer server and retained client mTLS material
  ansible.builtin.assert:
    that:
      - step_ca_root_cert_pem | default('') | length > 0
      - step_ca_intermediate_cert_pem | default('') | length > 0
      - client_ca_pem | default('') | length > 0
      - client_crl_bundle_pem | default('') | length > 0
    fail_msg: Printer nginx requires Smallstep server trust and retained client CA material
  no_log: true

- name: Issue and renew the printer endpoint certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: Printer
    step_ca_endpoint_subject: "octoprint.{{ domain }}"
    step_ca_endpoint_sans: ["octoprint.{{ domain }}", "printer.{{ domain }}", "lab-printer-01.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/octoprint.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/octoprint.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/octoprint.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-printer-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-printer-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-printer-certificate.timer
    step_ca_endpoint_reload_service: nginx
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run

- name: Install the printer client CA
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.pem
    content: "{{ client_ca_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  when: step_ca_root_cert_pem | default('') | length > 0
  notify: reload printer nginx

- name: Install the current client certificate revocation list for printer mTLS
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.crl.pem
    content: "{{ client_crl_bundle_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  notify: reload printer nginx
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Configure nginx as the only network listener for OctoPrint
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/octoprint.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      map $http_upgrade $connection_upgrade {
          default upgrade;
          '' close;
      }
      server {
          listen 10.10.20.80:443 ssl;
          server_name octoprint.{{ domain }} printer.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/tls/octoprint.crt.pem;
          ssl_certificate_key /var/lib/boetticher/identity/tls/octoprint.key.pem;
          ssl_client_certificate /var/lib/boetticher/identity/tls/client-ca.pem;
          ssl_crl /var/lib/boetticher/identity/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          if ($ssl_client_s_dn != "CN=client-operator.{{ domain }},O=boetticher") { return 403; }
          client_max_body_size 1G;
          location / {
              proxy_pass http://127.0.0.1:5000;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Host $host;
              proxy_set_header X-Forwarded-Proto https;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection $connection_upgrade;
              proxy_read_timeout 3600s;
          }
      }
  when: step_ca_root_cert_pem | default('') | length > 0
  notify: reload printer nginx

- name: Remove the distribution nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload printer nginx

- name: Enable the printer nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/octoprint.conf
    dest: /etc/nginx/sites-enabled/octoprint.conf
    state: link
  when: step_ca_root_cert_pem | default('') | length > 0
  notify: reload printer nginx

- name: Enable and start OctoPrint and nginx after certificate installation
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [octoprint, nginx]
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Wait for the OctoPrint backend before advertising the endpoint
  ansible.builtin.uri:
    url: http://127.0.0.1:5000/
    method: GET
    status_code: 200
    return_content: false
    timeout: 5
  register: octoprint_backend
  retries: 10
  delay: 1
  until: octoprint_backend.status | default(0) == 200
  when:
    - step_ca_root_cert_pem | default('') | length > 0
    - boetticher_deploy_phase | default('full') in ['full', 'services']

- name: Apply the mTLS frontend before testing its negative path
  ansible.builtin.meta: flush_handlers

- name: Verify a client without a certificate is rejected before OctoPrint
  ansible.builtin.uri:
    url: "https://octoprint.{{ domain }}/"
    method: GET
    ca_path: /var/lib/boetticher/identity/tls/client-ca.pem
    status_code: 400
    return_content: false
  when: step_ca_root_cert_pem | default('') | length > 0
