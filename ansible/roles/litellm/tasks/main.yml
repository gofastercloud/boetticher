---
- name: Require an immutable Bifrost LiteLLM-compatible appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Bifrost requires a qualified immutable appliance artifact"

- name: Require the typed Bifrost configuration projection
  ansible.builtin.assert:
    that:
      - module_configs.litellm is defined
      - module_configs.litellm.upstreams | length > 0
      - module_configs.litellm.models | length > 0
    fail_msg: "Bifrost requires the validated upstream and model-alias projection"
  no_log: true

- name: Create the Bifrost runtime configuration directory
  ansible.builtin.file:
    path: /etc/boetticher/litellm
    state: directory
    owner: root
    group: root
    mode: '0751'

- name: Render the Bifrost LiteLLM-compatible model routing configuration
  ansible.builtin.copy:
    dest: /etc/boetticher/litellm/config.json
    owner: root
    group: bifrost
    mode: '0640'
    content: |
      {
        "listen": "127.0.0.1:4000",
        "upstreams": [
      {% for upstream in module_configs.litellm.upstreams %}
          {
            "name": {{ upstream.name | to_json }},
            "base_url": {{ upstream.base_url | to_json }},
            "credential": {{ upstream.api_key_secret | lower | replace('_', '-') | replace('.', '-') | to_json }}
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        ],
        "models": [
      {% for model in module_configs.litellm.models %}
          {
            "alias": {{ model.alias | to_json }},
            "upstream": {{ model.upstream | to_json }},
            "model": {{ model.model | to_json }}
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        ]
      }
  no_log: true
  notify: restart litellm

- name: Create the LiteLLM TLS identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate the LiteLLM endpoint private key locally
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, /var/lib/boetticher/identity/tls/litellm.key.pem]
  args:
    creates: /var/lib/boetticher/identity/tls/litellm.key.pem

- name: Restrict the LiteLLM endpoint private key
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls/litellm.key.pem
    owner: root
    group: root
    mode: '0600'

- name: Generate the LiteLLM endpoint CSR locally
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha256
      - -key
      - /var/lib/boetticher/identity/tls/litellm.key.pem
      - -subj
      - "/CN=litellm.{{ domain }}"
      - -addext
      - "subjectAltName=DNS:litellm.{{ domain }},DNS:ai.{{ domain }},DNS:lab-litellm-01.{{ domain }}"
      - -out
      - /var/lib/boetticher/identity/tls/litellm.csr.pem
  args:
    creates: /var/lib/boetticher/identity/tls/litellm.csr.pem

- name: Fetch the LiteLLM CSR during the PKI bootstrap phase
  ansible.builtin.fetch:
    src: /var/lib/boetticher/identity/tls/litellm.csr.pem
    dest: "{{ pki_csr_output_dir }}/litellm.csr.pem"
    flat: true
  when: pki_bootstrap_phase | default(false) | bool

- name: Require controller-issued LiteLLM server and client-CA material
  ansible.builtin.assert:
    that:
      - client_ca_pem is defined
      - client_crl_pem is defined
      - client_crl_pem | length > 0
      - (pki_bootstrap_phase | default(false) | bool) or (litellm_server_cert_pem is defined and litellm_server_cert_pem | length > 0)
    fail_msg: "LiteLLM nginx requires the existing Boetticher PKI server certificate and client CA"
  no_log: true

- name: Install LiteLLM server certificate and client CA
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {dest: /var/lib/boetticher/identity/tls/litellm.crt.pem, content: "{{ litellm_server_cert_pem | default('') }}"}
    - {dest: /var/lib/boetticher/identity/tls/client-ca.pem, content: "{{ client_ca_pem | default('') }}"}
  no_log: true
  when: litellm_server_cert_pem | default('') | length > 0
  notify: restart nginx

- name: Install the current client certificate revocation list for LiteLLM mTLS
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.crl.pem
    content: "{{ client_crl_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  notify: restart nginx
  when: litellm_server_cert_pem | default('') | length > 0

- name: Configure nginx as the only LiteLLM listener
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/litellm.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen 10.10.20.60:443 ssl;
          server_name litellm.{{ domain }} ai.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/tls/litellm.crt.pem;
          ssl_certificate_key /var/lib/boetticher/identity/tls/litellm.key.pem;
          ssl_client_certificate /var/lib/boetticher/identity/tls/client-ca.pem;
          ssl_crl /var/lib/boetticher/identity/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          location = /v1/chat/completions {
              limit_except POST { deny all; }
              proxy_pass http://127.0.0.1:4000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
          location ^~ /internal/ {
              return 404;
          }
          location / {
              if ($ssl_client_s_dn ~ "CN=aiops-router-client(?:,|$)") { return 403; }
              proxy_pass http://127.0.0.1:4000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
  when: litellm_server_cert_pem | default('') | length > 0
  notify: restart nginx

- name: Remove the distribution nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Enable the LiteLLM nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/litellm.conf
    dest: /etc/nginx/sites-enabled/litellm.conf
    state: link
  when: litellm_server_cert_pem | default('') | length > 0
  notify: restart nginx

- name: Create the nginx systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Create the nginx systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Order LiteLLM nginx after the guest network is online
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/boetticher-network.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # The listener uses the fixed module address, which may not exist when
      # the distribution nginx unit starts during early guest boot.
      [Unit]
      After=network-online.target
      Wants=network-online.target
  notify: restart nginx

- name: Enable and start the LiteLLM backend and nginx frontend
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  register: litellm_service_start
  failed_when: false
  loop: [litellm, nginx]
  when: litellm_server_cert_pem | default('') | length > 0

- name: Inspect LiteLLM service state after runtime configuration
  ansible.builtin.command: systemctl show litellm --property=ActiveState --property=SubState --value
  register: litellm_service_state
  changed_when: false
  when: litellm_server_cert_pem | default('') | length > 0

- name: Inspect LiteLLM runtime credential materialization
  ansible.builtin.command: >-
    test -s /run/credentials/litellm.service/{{ upstream.api_key_secret | lower | replace('_', '-') | replace('.', '-') }}
  loop: "{{ module_configs.litellm.upstreams }}"
  loop_control:
    loop_var: upstream
  register: litellm_runtime_credentials
  changed_when: false
  failed_when: false
  when: litellm_server_cert_pem | default('') | length > 0

- name: Collect bounded Bifrost service diagnostics when startup is unhealthy
  ansible.builtin.command: systemctl status litellm --no-pager --full
  register: litellm_service_diagnostics
  changed_when: false
  failed_when: false
  when:
    - litellm_server_cert_pem | default('') | length > 0
    - >-
      (litellm_service_start.results | default([]) | selectattr('item', 'equalto', 'litellm') | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0) or
      (litellm_service_state.stdout_lines | default([]) != ['active', 'running']) or
      (litellm_runtime_credentials.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0)

- name: Restart LiteLLM after credential projection or an unhealthy start
  ansible.builtin.systemd_service:
    name: litellm
    state: restarted
    daemon_reload: true
  register: litellm_recovery_result
  failed_when: false
  when:
    - litellm_server_cert_pem | default('') | length > 0
    - >-
      (boetticher_credential_dropin_install is changed) or
      (litellm_service_state.stdout_lines | default([]) != ['active', 'running']) or
      (litellm_runtime_credentials.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0)

- name: Inspect final LiteLLM service state after recovery attempt
  ansible.builtin.command: systemctl show litellm --property=ActiveState --property=SubState --value
  register: litellm_final_service_state
  changed_when: false
  when: litellm_server_cert_pem | default('') | length > 0

- name: Collect final bounded Bifrost diagnostics when recovery failed
  ansible.builtin.command: systemctl status litellm --no-pager --full
  register: litellm_final_service_diagnostics
  changed_when: false
  failed_when: false
  when:
    - litellm_server_cert_pem | default('') | length > 0
    - litellm_final_service_state.stdout_lines | default([]) != ['active', 'running']

- name: Require the Bifrost backend to be running after runtime configuration
  ansible.builtin.assert:
    that:
      - litellm_final_service_state.stdout_lines | default([]) == ['active', 'running']
    fail_msg: >-
      Bifrost LiteLLM-compatible backend is unhealthy:
      {{ litellm_final_service_diagnostics.stdout | default(litellm_service_diagnostics.stdout | default('systemd status unavailable')) | trim }}
  when: litellm_server_cert_pem | default('') | length > 0
