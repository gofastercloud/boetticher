---
- name: Require an immutable LiteLLM appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "LiteLLM requires a qualified immutable appliance artifact"

- name: Require the typed LiteLLM configuration projection
  ansible.builtin.assert:
    that:
      - module_configs.litellm is defined
      - module_configs.litellm.upstreams | length > 0
      - module_configs.litellm.models | length > 0
    fail_msg: "LiteLLM requires the validated upstream and model-alias projection"
  no_log: true

- name: Create the LiteLLM runtime configuration directory
  ansible.builtin.file:
    path: /etc/boetticher/litellm
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Render only declared provider-neutral model aliases
  ansible.builtin.copy:
    dest: /etc/boetticher/litellm/config.yaml
    owner: root
    group: litellm
    mode: '0640'
    content: |
      model_list:
      {% for model in module_configs.litellm.models %}
      {% for upstream in module_configs.litellm.upstreams %}
      {% if model.upstream == upstream.name %}
        - model_name: {{ model.alias }}
          litellm_params:
            model: {{ model.model }}
            api_base: {{ upstream.base_url }}
            api_key: os.environ/LITELLM_SECRET_{{ upstream.api_key_secret | upper | replace('-', '_') | replace('.', '_') }}
      {% endif %}
      {% endfor %}
      {% endfor %}
  no_log: true
  notify: restart litellm

- name: Render the credential-only LiteLLM launcher
  ansible.builtin.copy:
    dest: /usr/lib/boetticher/litellm-start
    owner: root
    group: litellm
    mode: '0750'
    content: |
      #!/bin/sh
      set -eu
      {% for upstream in module_configs.litellm.upstreams %}
      export LITELLM_SECRET_{{ upstream.api_key_secret | upper | replace('-', '_') | replace('.', '_') }}="$(cat /run/credentials/litellm.service/{{ upstream.api_key_secret | lower | replace('_', '-') | replace('.', '-') }})"
      {% endfor %}
      exec /opt/litellm/bin/litellm "$@"
  no_log: true
  notify: restart litellm

- name: Create the LiteLLM TLS identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate the LiteLLM endpoint private key locally
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, /var/lib/boetticher/identity/tls/litellm.key.pem]
  args:
    creates: /var/lib/boetticher/identity/tls/litellm.key.pem

- name: Restrict the LiteLLM endpoint private key
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls/litellm.key.pem
    owner: root
    group: root
    mode: '0600'

- name: Generate the LiteLLM endpoint CSR locally
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha256
      - -key
      - /var/lib/boetticher/identity/tls/litellm.key.pem
      - -subj
      - "/CN=litellm.{{ domain }}"
      - -addext
      - "subjectAltName=DNS:litellm.{{ domain }},DNS:ai.{{ domain }},DNS:lab-litellm-01.{{ domain }}"
      - -out
      - /var/lib/boetticher/identity/tls/litellm.csr.pem
  args:
    creates: /var/lib/boetticher/identity/tls/litellm.csr.pem

- name: Fetch the LiteLLM CSR during the PKI bootstrap phase
  ansible.builtin.fetch:
    src: /var/lib/boetticher/identity/tls/litellm.csr.pem
    dest: "{{ pki_csr_output_dir }}/litellm.csr.pem"
    flat: true
  when: pki_bootstrap_phase | default(false) | bool

- name: Require controller-issued LiteLLM server and client-CA material
  ansible.builtin.assert:
    that:
      - client_ca_pem is defined
      - client_crl_pem is defined
      - client_crl_pem | length > 0
      - (pki_bootstrap_phase | default(false) | bool) or (litellm_server_cert_pem is defined and litellm_server_cert_pem | length > 0)
    fail_msg: "LiteLLM nginx requires the existing Boetticher PKI server certificate and client CA"
  no_log: true

- name: Install LiteLLM server certificate and client CA
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {dest: /var/lib/boetticher/identity/tls/litellm.crt.pem, content: "{{ litellm_server_cert_pem | default('') }}"}
    - {dest: /var/lib/boetticher/identity/tls/client-ca.pem, content: "{{ client_ca_pem | default('') }}"}
  no_log: true
  when: litellm_server_cert_pem | default('') | length > 0
  notify: reload nginx

- name: Install the current client certificate revocation list for LiteLLM mTLS
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.crl.pem
    content: "{{ client_crl_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  notify: reload nginx
  when: litellm_server_cert_pem | default('') | length > 0

- name: Configure nginx as the only LiteLLM listener
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/litellm.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen 10.10.20.60:443 ssl;
          server_name litellm.{{ domain }} ai.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/tls/litellm.crt.pem;
          ssl_certificate_key /var/lib/boetticher/identity/tls/litellm.key.pem;
          ssl_client_certificate /var/lib/boetticher/identity/tls/client-ca.pem;
          ssl_crl /var/lib/boetticher/identity/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          location = /v1/chat/completions {
              limit_except POST { deny all; }
              proxy_pass http://127.0.0.1:4000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
          location / {
              if ($ssl_client_s_dn ~ "CN=aiops-router-client(?:,|$)") { return 403; }
              proxy_pass http://127.0.0.1:4000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
  when: litellm_server_cert_pem | default('') | length > 0
  notify: reload nginx

- name: Remove the distribution nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Enable the LiteLLM nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/litellm.conf
    dest: /etc/nginx/sites-enabled/litellm.conf
    state: link
  when: litellm_server_cert_pem | default('') | length > 0
  notify: reload nginx

- name: Enable and start the LiteLLM backend and nginx frontend
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [litellm, nginx]
  when: litellm_server_cert_pem | default('') | length > 0
