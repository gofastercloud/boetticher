---
- name: Require the pinned arr appliance artifact
  ansible.builtin.assert:
    that:
      - boetticher_appliance_artifact | default(false) | bool
      - module_configs.arr is defined
    fail_msg: "arr requires a qualified pinned Sonarr/Radarr appliance artifact"

- name: Create the arr TLS identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Generate the arr endpoint private key
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, /var/lib/boetticher/identity/tls/arr.key.pem]
  args:
    creates: /var/lib/boetticher/identity/tls/arr.key.pem

- name: Restrict the arr endpoint private key
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls/arr.key.pem
    owner: root
    group: root
    mode: '0600'

- name: Require Smallstep arr server and retained client mTLS material
  ansible.builtin.assert:
    that:
      - step_ca_root_cert_pem | default('') | length > 0
      - step_ca_intermediate_cert_pem | default('') | length > 0
      - client_ca_pem | default('') | length > 0
      - client_crl_pem | default('') | length > 0
    fail_msg: arr nginx requires Smallstep server trust and retained client CA material
  no_log: true

- name: Issue and renew the arr endpoint certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: Arr
    step_ca_endpoint_subject: "sonarr.{{ domain }}"
    step_ca_endpoint_sans: ["sonarr.{{ domain }}", "radarr.{{ domain }}", "lab-arr-01.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/arr.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/arr.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/arr.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-arr-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-arr-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-arr-certificate.timer
    step_ca_endpoint_reload_service: nginx
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run

- name: Install the arr client CA and CRL
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.pem
    content: "{{ client_ca_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Install the arr client certificate revocation list
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.crl.pem
    content: "{{ client_crl_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Create persistent arr application state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: arr
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/arr/sonarr, owner: sonarr, mode: '0750'}
    - {path: /var/lib/arr/radarr, owner: radarr, mode: '0750'}
    - {path: /var/lib/arr/downloads, owner: root, mode: '2770'}

- name: Bind Sonarr and Radarr to loopback with no native login
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    owner: "{{ item.owner }}"
    group: arr
    mode: '0640'
    force: false
    content: |
      <Config>
        <BindAddress>127.0.0.1</BindAddress>
        <Port>{{ item.port }}</Port>
        <EnableSsl>False</EnableSsl>
        <LaunchBrowser>False</LaunchBrowser>
        <AuthenticationMethod>None</AuthenticationMethod>
        <AuthenticationRequired>DisabledForLocalAddresses</AuthenticationRequired>
      </Config>
  loop:
    - {dest: /var/lib/arr/sonarr/config.xml, owner: sonarr, port: 8989}
    - {dest: /var/lib/arr/radarr/config.xml, owner: radarr, port: 7878}
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Configure nginx as the only arr network listener
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/arr.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen 10.10.20.110:443 ssl;
          server_name sonarr.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/tls/arr.crt.pem;
          ssl_certificate_key /var/lib/boetticher/identity/tls/arr.key.pem;
          ssl_client_certificate /var/lib/boetticher/identity/tls/client-ca.pem;
          ssl_crl /var/lib/boetticher/identity/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          if ($ssl_client_s_dn != "CN=client-operator.{{ domain }},O=boetticher") { return 403; }
          location / {
              proxy_pass http://127.0.0.1:8989;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
      server {
          listen 10.10.20.110:443 ssl;
          server_name radarr.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/tls/arr.crt.pem;
          ssl_certificate_key /var/lib/boetticher/identity/tls/arr.key.pem;
          ssl_client_certificate /var/lib/boetticher/identity/tls/client-ca.pem;
          ssl_crl /var/lib/boetticher/identity/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          if ($ssl_client_s_dn != "CN=client-operator.{{ domain }},O=boetticher") { return 403; }
          location / {
              proxy_pass http://127.0.0.1:7878;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Enable arr nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/arr.conf
    dest: /etc/nginx/sites-enabled/arr.conf
    state: link
  when: step_ca_root_cert_pem | default('') | length > 0

- name: Enable and start the arr services behind nginx
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [sonarr, radarr, nginx]
  when: step_ca_root_cert_pem | default('') | length > 0
