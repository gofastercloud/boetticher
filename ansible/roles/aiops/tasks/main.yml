---
- name: Require an immutable AIOps appliance artifact
  ansible.builtin.assert:
    that:
      - boetticher_appliance_artifact | default(false) | bool
      - module_configs.aiops is defined
      - module_configs.aiops.model_alias | length > 0
    fail_msg: "AIOps requires a qualified appliance and declared AI Router alias"

- name: Create the protected AIOps state directory
  ansible.builtin.file:
    path: /var/lib/boetticher/aiops
    state: directory
    owner: boetticher-aiops
    group: boetticher-aiops
    mode: '0700'

- name: Create the adapter-owned endpoint identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: boetticher-aiops
    mode: '0750'

- name: Remove retired AIOps Pulse client-certificate identities
  ansible.builtin.file:
    path: "/var/lib/boetticher/identity/tls/{{ item }}"
    state: absent
  loop:
    - pulse-read.key.pem
    - pulse-read.crt.pem
    - pulse-read.csr.pem
    - pulse-note.key.pem
    - pulse-note.crt.pem
    - pulse-note.csr.pem

- name: Require Smallstep AIOps server and retained client identities
  ansible.builtin.assert:
    that:
      - step_ca_root_cert_pem is defined
      - step_ca_intermediate_cert_pem is defined
      - client_ca_pem is defined
    fail_msg: "AIOps requires the Smallstep server and retained client identities before activation"
  no_log: true

- name: Issue and renew the AIOps server certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: AIOps
    step_ca_endpoint_subject: "aiops.{{ domain }}"
    step_ca_endpoint_sans: ["aiops.{{ domain }}", "lab-aiops-01.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/aiops.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/aiops.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/aiops.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-aiops-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-aiops-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-aiops-certificate.timer
    step_ca_endpoint_reload_service: boetticher-aiops
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run
    step_ca_endpoint_certificate_owner: root
    step_ca_endpoint_certificate_group: boetticher-aiops
    step_ca_endpoint_certificate_mode: '0640'
    step_ca_endpoint_key_owner: root
    step_ca_endpoint_key_group: boetticher-aiops
    step_ca_endpoint_key_mode: '0640'

- name: Check whether the AIOps server certificate is ready
  ansible.builtin.stat:
    path: /var/lib/boetticher/identity/tls/aiops.step-ca
  register: aiops_step_ca_marker

- name: Issue and renew the AIOps Router canary client certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: AIOps Router canary
    step_ca_endpoint_subject: aiops-router-client
    step_ca_endpoint_sans: []
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/ai-router-client.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/ai-router-client.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/ai-router-client.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-aiops-router-client
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-aiops-router-client.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-aiops-router-client.timer
    step_ca_endpoint_reload_service: boetticher-aiops
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run
    step_ca_endpoint_certificate_group: boetticher-aiops
    step_ca_endpoint_certificate_mode: '0640'
    step_ca_endpoint_key_group: boetticher-aiops
    step_ca_endpoint_key_mode: '0640'

- name: Check whether the AIOps Router canary client certificate is ready
  ansible.builtin.stat:
    path: /var/lib/boetticher/identity/tls/ai-router-client.step-ca
  register: aiops_router_client_ready

- name: Issue and renew the AIOps log-query client certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: AIOps log-query client
    step_ca_endpoint_subject: aiops-log-read
    step_ca_endpoint_sans: []
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/log-query-client.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/log-query-client.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/log-query-client.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-aiops-log-query-client
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-aiops-log-query-client.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-aiops-log-query-client.timer
    step_ca_endpoint_reload_service: boetticher-aiops
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run
    step_ca_endpoint_certificate_group: boetticher-aiops
    step_ca_endpoint_certificate_mode: '0640'
    step_ca_endpoint_key_group: boetticher-aiops
    step_ca_endpoint_key_mode: '0640'

- name: Check whether the AIOps log-query client certificate is ready
  ansible.builtin.stat:
    path: /var/lib/boetticher/identity/tls/log-query-client.step-ca
  register: aiops_log_query_client_ready

- name: Install the AIOps platform CA
  ansible.builtin.copy:
    dest: "/var/lib/boetticher/identity/tls/{{ item.file }}"
    content: "{{ item.content }}"
    owner: root
    group: boetticher-aiops
    mode: '0640'
  loop:
    - {file: ca.crt.pem, content: "{{ client_ca_pem | default('') }}"}
  no_log: true

- name: Record that all AIOps endpoint identities are installed
  ansible.builtin.set_fact:
    aiops_server_identity_ready: "{{ aiops_step_ca_marker.stat.exists | default(false) | bool and aiops_router_client_ready.stat.exists | default(false) | bool and aiops_log_query_client_ready.stat.exists | default(false) | bool }}"

- name: Pin the selected provider-neutral model alias
  ansible.builtin.copy:
    dest: /etc/boetticher-aiops/runtime.env
    content: |
      AIOPS_MODEL_ALIAS={{ module_configs.aiops.model_alias }}
      AIOPS_PULSE_URL=https://monitor.{{ domain }}
      AIOPS_JOURNAL_URL=https://logs.{{ domain }}:19533/v1/query
      AIOPS_ROUTER_URL=https://ai.{{ domain }}/v1/chat/completions
    owner: root
    group: boetticher-aiops
    mode: '0640'

- name: Render the compiled read-only evidence catalog
  ansible.builtin.copy:
    dest: /etc/boetticher-aiops/evidence-policy.json
    owner: root
    group: boetticher-aiops
    mode: '0640'
    content: "{{ {'hosts': {'lab-fw-01': ['kea-dhcp4.service', 'nftables.service'], 'lab-dns-01': ['blocky.service', 'pdns.service', 'chrony.service'], 'lab-monitor-01': ['pulse.service'], 'lab-log-01': ['systemd-journal-remote.service', 'boetticher-log-query.service'], 'lab-bifrost-01': ['bifrost.service', 'nginx.service'], 'lab-aiops-01': ['boetticher-aiops.service', 'holmes.service']}} | to_nice_json }}"

- name: Keep AIOps stopped until every activation gate is proven
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: false
    state: stopped
  loop: [boetticher-aiops, boetticher-aiops.socket, holmes]
  when: not (
    aiops_runtime_credentials_ready | default(false) | bool
    and aiops_server_identity_ready | default(false) | bool
    and aiops_model_alias_qualified | default(false) | bool
    )

- name: Enable AIOps only after credentials, endpoint identity, metadata and live canary qualification exist
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [holmes, boetticher-aiops.socket, boetticher-aiops]
  when:
    - aiops_runtime_credentials_ready | default(false) | bool
    - aiops_server_identity_ready | default(false) | bool
    - aiops_model_alias_qualified | default(false) | bool
