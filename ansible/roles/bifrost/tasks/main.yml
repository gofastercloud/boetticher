---
- name: Require an immutable Bifrost-compatible appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Bifrost requires a qualified immutable appliance artifact"

- name: Require the typed Bifrost configuration projection
  ansible.builtin.assert:
    that:
      - module_configs.bifrost is defined
      - module_configs.bifrost.upstreams | length > 0
      - module_configs.bifrost.models | length > 0
    fail_msg: "Bifrost requires the validated upstream and model-alias projection"
  no_log: true

- name: Create the Bifrost runtime configuration directory
  ansible.builtin.file:
    path: /etc/boetticher/bifrost
    state: directory
    owner: root
    group: root
    mode: '0751'

- name: Render the Bifrost-compatible model routing configuration
  ansible.builtin.copy:
    dest: /etc/boetticher/bifrost/config.json
    owner: root
    group: bifrost
    mode: '0640'
    content: |
      {
        "listen": "127.0.0.1:4000",
        "upstreams": [
      {% for upstream in module_configs.bifrost.upstreams %}
          {
            "name": {{ upstream.name | to_json }},
            "base_url": {{ upstream.base_url | to_json }},
            "credential": {{ upstream.api_key_secret | lower | replace('_', '-') | replace('.', '-') | to_json }}
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        ],
        "models": [
      {% for model in module_configs.bifrost.models %}
          {
            "alias": {{ model.alias | to_json }},
            "upstream": {{ model.upstream | to_json }},
            "model": {{ model.model | to_json }}
          }{% if not loop.last %},{% endif %}
      {% endfor %}
        ]
      }
  no_log: true
  notify: restart bifrost

- name: Create the Bifrost TLS identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Require Smallstep Bifrost server and retained client-CA material
  ansible.builtin.assert:
    that:
      - step_ca_root_cert_pem is defined
      - step_ca_intermediate_cert_pem is defined
      - client_ca_pem is defined
      - client_crl_pem is defined
      - client_crl_pem | length > 0
    fail_msg: "Bifrost nginx requires Smallstep server trust and retained client CA material"
  no_log: true

- name: Issue and renew the Bifrost endpoint certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: Bifrost
    step_ca_endpoint_subject: "bifrost.{{ domain }}"
    step_ca_endpoint_sans: ["bifrost.{{ domain }}", "ai.{{ domain }}", "lab-bifrost-01.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/bifrost.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/bifrost.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/bifrost.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-bifrost-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-bifrost-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-bifrost-certificate.timer
    step_ca_endpoint_reload_service: nginx
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run

- name: Install Bifrost server certificate and client CA
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - {dest: /var/lib/boetticher/identity/tls/client-ca.pem, content: "{{ client_ca_pem | default('') }}"}
  no_log: true
  when: step_ca_root_cert_pem is defined
  notify: restart nginx

- name: Install the current client certificate revocation list for Bifrost mTLS
  ansible.builtin.copy:
    dest: /var/lib/boetticher/identity/tls/client-ca.crl.pem
    content: "{{ client_crl_pem }}"
    owner: root
    group: root
    mode: '0644'
  no_log: true
  notify: restart nginx
  when: step_ca_root_cert_pem is defined

- name: Configure nginx as the only Bifrost listener
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/bifrost.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen 10.10.20.60:443 ssl;
          server_name bifrost.{{ domain }} ai.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/tls/bifrost.crt.pem;
          ssl_certificate_key /var/lib/boetticher/identity/tls/bifrost.key.pem;
          ssl_client_certificate /var/lib/boetticher/identity/tls/client-ca.pem;
          ssl_crl /var/lib/boetticher/identity/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          if ($ssl_client_s_dn !~ "^(?:CN=client-operator\\.{{ domain | regex_escape }}(?:,O=boetticher)?|CN=client-aiops-router-client\\.{{ domain | regex_escape }}(?:,O=boetticher)?)$") { return 403; }
          location = /v1/chat/completions {
              limit_except POST { deny all; }
              proxy_pass http://127.0.0.1:4000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
          location ^~ /internal/ {
              return 404;
          }
          location / {
              if ($ssl_client_s_dn ~ "CN=client-aiops-router-client(?:\\.|,|$)") { return 403; }
              proxy_pass http://127.0.0.1:4000;
              proxy_set_header Host $host;
              proxy_set_header X-Forwarded-Proto https;
          }
      }
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined
  notify: restart nginx

- name: Remove the distribution nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Enable the Bifrost nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/bifrost.conf
    dest: /etc/nginx/sites-enabled/bifrost.conf
    state: link
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined
  notify: restart nginx

- name: Create the nginx systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Order Bifrost nginx after the guest network is online
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/boetticher-network.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # The listener uses the fixed module address, which may not exist when
      # the distribution nginx unit starts during early guest boot.
      [Unit]
      After=network-online.target
      Wants=network-online.target
  notify: restart nginx

- name: Enable and start the Bifrost backend and nginx frontend
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  register: bifrost_service_start
  failed_when: false
  loop: [bifrost, nginx]
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined

- name: Inspect Bifrost service state after runtime configuration
  ansible.builtin.command: systemctl show bifrost --property=ActiveState --property=SubState --value
  register: bifrost_service_state
  changed_when: false
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined

- name: Inspect Bifrost runtime credential materialization
  ansible.builtin.command: >-
    test -s /run/credentials/bifrost.service/{{ upstream.api_key_secret | lower | replace('_', '-') | replace('.', '-') }}
  loop: "{{ module_configs.bifrost.upstreams }}"
  loop_control:
    loop_var: upstream
  register: bifrost_runtime_credentials
  changed_when: false
  failed_when: false
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined

- name: Collect bounded Bifrost service diagnostics when startup is unhealthy
  ansible.builtin.command: >-
    systemctl show bifrost
    --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,StatusText,ExecMainStartTimestamp
  register: bifrost_service_diagnostics
  changed_when: false
  failed_when: false
  when:
    - step_ca_root_cert_pem is defined
    - step_ca_intermediate_cert_pem is defined
    - >-
      (bifrost_service_start.results | default([]) | selectattr('item', 'equalto', 'bifrost') | selectattr('failed', 'defined') | selectattr('failed') | list | length > 0) or
      (bifrost_service_state.stdout_lines | default([]) != ['active', 'running']) or
      (bifrost_runtime_credentials.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0)

- name: Restart Bifrost after credential projection or an unhealthy start
  ansible.builtin.systemd_service:
    name: bifrost
    state: restarted
    daemon_reload: true
  register: bifrost_recovery_result
  failed_when: false
  when:
    - step_ca_root_cert_pem is defined
    - step_ca_intermediate_cert_pem is defined
    - >-
      (boetticher_credential_dropin_install is changed) or
      (bifrost_service_state.stdout_lines | default([]) != ['active', 'running']) or
      (bifrost_runtime_credentials.results | default([]) | selectattr('rc', 'ne', 0) | list | length > 0)

- name: Inspect final Bifrost service state after recovery attempt
  ansible.builtin.command: systemctl show bifrost --property=ActiveState --property=SubState --value
  register: bifrost_final_service_state
  changed_when: false
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined

- name: Collect final bounded Bifrost diagnostics when recovery failed
  ansible.builtin.command: >-
    systemctl show bifrost
    --property=LoadState,ActiveState,SubState,Result,ExecMainCode,ExecMainStatus,StatusText,ExecMainStartTimestamp
  register: bifrost_final_service_diagnostics
  changed_when: false
  failed_when: false
  when:
    - step_ca_root_cert_pem is defined
    - step_ca_intermediate_cert_pem is defined
    - bifrost_final_service_state.stdout_lines | default([]) != ['active', 'running']

- name: Require the Bifrost backend to be running after runtime configuration
  ansible.builtin.assert:
    that:
      - bifrost_final_service_state.stdout_lines | default([]) == ['active', 'running']
    fail_msg: >-
      Bifrost-compatible backend is unhealthy:
      {{ bifrost_final_service_diagnostics.stdout | default(bifrost_service_diagnostics.stdout | default('systemd status unavailable')) | trim }}
  when: step_ca_root_cert_pem is defined and step_ca_intermediate_cert_pem is defined
