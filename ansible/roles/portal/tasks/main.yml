---
- name: Require an immutable portal appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Portal runtime configuration requires a qualified boetticher appliance artifact"

- name: Require a controller-built portal archive
  ansible.builtin.assert:
    that:
      - portal_source_archive is defined
      - portal_source_archive | length > 0
    fail_msg: "portal_source_archive must point to the controller-built static portal archive"

- name: Require the controller portal content digest
  ansible.builtin.assert:
    that:
      - portal_content_digest is defined
      - portal_content_digest is match('^[0-9a-f]{64}$')
    fail_msg: "portal_content_digest must be a controller-computed SHA-256 digest"

- name: Require controller-issued portal mTLS material
  ansible.builtin.assert:
    that:
      - client_ca_pem is defined
      - client_crl_pem is defined
      - client_crl_pem | length > 0
      - (pki_bootstrap_phase | default(false) | bool) or (portal_server_cert_pem is defined and portal_server_cert_pem | length > 0)
    fail_msg: "The portal requires controller-issued server and client-CA material"
  no_log: true

- name: Create portal document root
  ansible.builtin.file:
    path: /var/www/boetticher
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create content-addressed portal release root
  ansible.builtin.file:
    path: /var/www/boetticher/releases
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check the published portal content and metadata
  ansible.builtin.shell: |
    set -eu
    current=/var/www/boetticher/current
    [ -L "$current" ] || exit 1
    root="$(readlink -f "$current")"
    case "$root" in
      /var/www/boetticher/releases/*) ;;
      *) exit 1 ;;
    esac
    [ -d "$root" ] || exit 1
    if find "$root" -type l -print -quit | grep -q .; then
      exit 1
    fi
    if find "$root" -type f \( ! -user root -o ! -group root -o ! -perm 0644 \) -print -quit | grep -q .; then
      exit 1
    fi
    actual="$({
      find "$root" -type f -printf '%P\n' | LC_ALL=C sort
    } | while IFS= read -r relative; do
      printf '%s\0' "$relative"
      cat "$root/$relative"
    done | sha256sum | awk '{print $1}')"
    [ "$actual" = "{{ portal_content_digest }}" ]
  args:
    executable: /bin/sh
  register: portal_publication_state
  changed_when: false
  failed_when: false
  when: boetticher_deploy_phase | default('full') != 'bootstrap'

- name: Publish generated portal transactionally when content or metadata changed
  block:
    - name: Refuse an unmanaged portal current path
      ansible.builtin.shell: |
        set -eu
        current=/var/www/boetticher/current
        if [ -e "$current" ] && [ ! -L "$current" ]; then
          exit 1
        fi
      args:
        executable: /bin/sh
      changed_when: false

    - name: Remove abandoned portal staging paths
      ansible.builtin.file:
        path: "/var/www/boetticher/.staging-{{ portal_content_digest }}"
        state: absent

    - name: Create portal staging path
      ansible.builtin.file:
        path: "/var/www/boetticher/.staging-{{ portal_content_digest }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Extract the deterministic portal archive into staging
      ansible.builtin.unarchive:
        src: "{{ portal_source_archive }}"
        dest: "/var/www/boetticher/.staging-{{ portal_content_digest }}"
        remote_src: false
        owner: root
        group: root
        mode: "0644"

    - name: Validate staged portal content and metadata
      ansible.builtin.shell: |
        set -eu
        root=/var/www/boetticher/.staging-{{ portal_content_digest }}
        if find "$root" -type l -print -quit | grep -q .; then
          exit 1
        fi
        if find "$root" -type f \( ! -user root -o ! -group root -o ! -perm 0644 \) -print -quit | grep -q .; then
          exit 1
        fi
        actual="$({
          find "$root" -type f -printf '%P\n' | LC_ALL=C sort
        } | while IFS= read -r relative; do
          printf '%s\0' "$relative"
          cat "$root/$relative"
        done | sha256sum | awk '{print $1}')"
        [ "$actual" = "{{ portal_content_digest }}" ]
      args:
        executable: /bin/sh
      changed_when: false

    - name: Refuse an unmanaged existing portal release
      ansible.builtin.shell: |
        set -eu
        root=/var/www/boetticher/releases/{{ portal_content_digest }}
        if [ ! -e "$root" ] && [ ! -L "$root" ]; then
          exit 0
        fi
        [ -d "$root" ] && [ ! -L "$root" ] || exit 1
        if find "$root" -type l -print -quit | grep -q .; then
          exit 1
        fi
        if find "$root" -type f \( ! -user root -o ! -group root -o ! -perm 0644 \) -print -quit | grep -q .; then
          exit 1
        fi
      args:
        executable: /bin/sh
      changed_when: false

    - name: Replace the exact content-addressed portal release
      ansible.builtin.file:
        path: "/var/www/boetticher/releases/{{ portal_content_digest }}"
        state: absent

    - name: Install the validated portal release
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "/var/www/boetticher/.staging-{{ portal_content_digest }}"
          - "/var/www/boetticher/releases/{{ portal_content_digest }}"

    - name: Remove the temporary portal current link
      ansible.builtin.file:
        path: "/var/www/boetticher/.current-{{ portal_content_digest }}"
        state: absent

    - name: Create the new portal current link
      ansible.builtin.command:
        argv:
          - ln
          - -s
          - "/var/www/boetticher/releases/{{ portal_content_digest }}"
          - "/var/www/boetticher/.current-{{ portal_content_digest }}"

    - name: Atomically activate the new portal current link
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "/var/www/boetticher/.current-{{ portal_content_digest }}"
          - /var/www/boetticher/current
  always:
    - name: Remove portal staging path after publication attempt
      ansible.builtin.file:
        path: "/var/www/boetticher/.staging-{{ portal_content_digest }}"
        state: absent
    - name: Remove portal temporary current link after publication attempt
      ansible.builtin.file:
        path: "/var/www/boetticher/.current-{{ portal_content_digest }}"
        state: absent
  when:
    - boetticher_deploy_phase | default('full') != 'bootstrap'
    - portal_publication_state.rc | default(1) != 0

- name: Create the portal TLS directory
  ansible.builtin.file:
    path: /etc/boetticher/tls
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Generate the portal endpoint private key locally
  ansible.builtin.command:
    argv:
      - openssl
      - genpkey
      - -algorithm
      - EC
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -out
      - /etc/boetticher/tls/portal.key.pem
  args:
    creates: /etc/boetticher/tls/portal.key.pem

- name: Restrict the portal endpoint private key
  ansible.builtin.file:
    path: /etc/boetticher/tls/portal.key.pem
    owner: root
    group: root
    mode: "0600"

- name: Generate the portal endpoint CSR locally
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha256
      - -key
      - /etc/boetticher/tls/portal.key.pem
      - -subj
      - /CN=portal.lab.home.arpa
      - -addext
      - subjectAltName=DNS:portal.lab.home.arpa,DNS:lab-portal-01.lab.home.arpa
      - -out
      - /etc/boetticher/tls/portal.csr.pem
  args:
    creates: /etc/boetticher/tls/portal.csr.pem

- name: Fetch the endpoint-generated portal CSR to the controller runtime directory
  ansible.builtin.fetch:
    src: /etc/boetticher/tls/portal.csr.pem
    dest: "{{ pki_csr_output_dir }}/portal.csr.pem"
    flat: true
  when: pki_bootstrap_phase | default(false) | bool

- name: Install portal server certificate chain
  ansible.builtin.copy:
    content: "{{ portal_server_cert_pem }}"
    dest: /etc/boetticher/tls/portal.crt.pem
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify: reload nginx
  when:
    - portal_server_cert_pem is defined
    - portal_server_cert_pem | length > 0

- name: Install the client CA for portal mTLS
  ansible.builtin.copy:
    content: "{{ client_ca_pem }}"
    dest: /etc/boetticher/tls/client-ca.pem
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify: reload nginx

- name: Install the current client certificate revocation list for portal mTLS
  ansible.builtin.copy:
    content: "{{ client_crl_pem }}"
    dest: /etc/boetticher/tls/client-ca.crl.pem
    owner: root
    group: root
    mode: "0644"
  no_log: true
  notify: reload nginx

- name: Configure nginx for the generated portal
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/boetticher.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      server {
          listen 10.10.10.30:443 ssl;
          server_name portal.lab.home.arpa;
          root /var/www/boetticher/current;
          index index.html;

          ssl_certificate /etc/boetticher/tls/portal.crt.pem;
          ssl_certificate_key /etc/boetticher/tls/portal.key.pem;
          ssl_client_certificate /etc/boetticher/tls/client-ca.pem;
          ssl_crl /etc/boetticher/tls/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_verify_depth 3;
          ssl_protocols TLSv1.2 TLSv1.3;

          location / { try_files $uri $uri/ =404; }
      }
  notify: reload nginx
  when:
    - portal_server_cert_pem is defined
    - portal_server_cert_pem | length > 0

- name: Remove the distribution nginx default site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Enable generated portal nginx site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/boetticher.conf
    dest: /etc/nginx/sites-enabled/boetticher.conf
    state: link
  notify: reload nginx
  when:
    - portal_server_cert_pem is defined
    - portal_server_cert_pem | length > 0

- name: Enable and reload the portal nginx service
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: reloaded
  when:
    - portal_server_cert_pem is defined
    - portal_server_cert_pem | length > 0
