---
- name: Require the immutable StreamDeck appliance and raw USB export
  ansible.builtin.assert:
    that:
      - boetticher_appliance_artifact | default(false) | bool
      - module_configs.streamdeck is defined
      - usb_export_manifests | selectattr('vmid', 'equalto', 220) | list | length == 1
      - ((usb_export_manifests | selectattr('vmid', 'equalto', 220) | first).exports | length) == 1
      - ((usb_export_manifests | selectattr('vmid', 'equalto', 220) | first).exports | first).device_type == 'raw-usb'
    fail_msg: StreamDeck requires its qualified appliance and one validated raw USB export

- name: Create the StreamDeck identity directory
  ansible.builtin.file:
    path: /var/lib/streamdeck/tls
    state: directory
    owner: root
    group: streamdeck
    mode: '0750'

- name: Generate the StreamDeck client private key
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, /var/lib/streamdeck/tls/streamdeck.key.pem]
  args:
    creates: /var/lib/streamdeck/tls/streamdeck.key.pem
  when: boetticher_deploy_phase | default('full') != 'health'

- name: Restrict the StreamDeck client private key
  ansible.builtin.file:
    path: /var/lib/streamdeck/tls/streamdeck.key.pem
    owner: root
    group: streamdeck
    mode: '0640'
  when: boetticher_deploy_phase | default('full') != 'health'

- name: Generate the StreamDeck client CSR
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha256
      - -key
      - /var/lib/streamdeck/tls/streamdeck.key.pem
      - -subj
      - /CN=lab-streamdeck-01
      - -out
      - /var/lib/streamdeck/tls/streamdeck.csr.pem
  args:
    creates: /var/lib/streamdeck/tls/streamdeck.csr.pem
  when: boetticher_deploy_phase | default('full') != 'health'

- name: Restrict the StreamDeck client CSR
  ansible.builtin.file:
    path: /var/lib/streamdeck/tls/streamdeck.csr.pem
    owner: root
    group: streamdeck
    mode: '0640'
  when: boetticher_deploy_phase | default('full') != 'health'

- name: Fetch the StreamDeck CSR during PKI bootstrap
  ansible.builtin.fetch:
    src: /var/lib/streamdeck/tls/streamdeck.csr.pem
    dest: "{{ pki_csr_output_dir }}/streamdeck.csr.pem"
    flat: true
  when: pki_bootstrap_phase | default(false) | bool

- name: Require the controller-issued StreamDeck client certificate and CA
  ansible.builtin.assert:
    that:
      - client_ca_pem | default('') | length > 0
      - (pki_bootstrap_phase | default(false) | bool) or (streamdeck_client_cert_pem | default('') | length > 0)
    fail_msg: StreamDeck requires its controller-issued mTLS client certificate before activation
  no_log: true

- name: Install the StreamDeck client certificate and Pulse CA
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: streamdeck
    mode: '0640'
  loop:
    - {dest: /var/lib/streamdeck/tls/streamdeck.crt.pem, content: "{{ streamdeck_client_cert_pem | default('') }}"}
    - {dest: /var/lib/streamdeck/tls/ca.pem, content: "{{ pulse_server_ca_pem }}"}
  no_log: true
  when: streamdeck_client_cert_pem | default('') | length > 0

- name: Render the fixed StreamDeck display configuration
  ansible.builtin.copy:
    dest: /etc/boetticher/streamdeck.json
    owner: root
    group: streamdeck
    mode: '0640'
    content: "{{ {'pulse_url': 'https://monitor.' + domain, 'serial': (((usb_export_manifests | selectattr('vmid', 'equalto', 220) | first).exports | first).serial | default('', true)), 'client_certificate': '/var/lib/streamdeck/tls/streamdeck.crt.pem', 'client_key': '/var/lib/streamdeck/tls/streamdeck.key.pem', 'ca_certificate': '/var/lib/streamdeck/tls/ca.pem'} | to_nice_json }}\n"

- name: Keep StreamDeck stopped until mTLS and runtime credential gates pass
  ansible.builtin.systemd_service:
    name: streamdeck-status.service
    enabled: false
    state: stopped
    daemon_reload: true
  when: not (
    streamdeck_client_cert_pem | default('') | length > 0
    and streamdeck_runtime_credentials_ready | default(false) | bool
    )

- name: Enable StreamDeck after mTLS and runtime credential gates pass
  ansible.builtin.systemd_service:
    name: streamdeck-status.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - streamdeck_client_cert_pem | default('') | length > 0
    - streamdeck_runtime_credentials_ready | default(false) | bool
