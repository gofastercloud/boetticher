---
- name: Require the typed StreamDeck configuration
  ansible.builtin.assert:
    that:
      - module_configs.streamdeck is defined
      - usb_export_manifests | selectattr('vmid', 'equalto', 220) | list | length == 1
    fail_msg: StreamDeck requires its validated USB export manifest

- name: Create endpoint-local StreamDeck identity
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: streamdeck
    group: streamdeck
    mode: '0700'

- name: Generate endpoint-local StreamDeck client key
  ansible.builtin.command:
    argv: [openssl, genpkey, -algorithm, EC, -pkeyopt, ec_paramgen_curve:P-256, -out, /var/lib/boetticher/identity/tls/streamdeck.key.pem]
  args:
    creates: /var/lib/boetticher/identity/tls/streamdeck.key.pem

- name: Generate endpoint-local StreamDeck client CSR
  ansible.builtin.command:
    argv: [openssl, req, -new, -sha256, -key, /var/lib/boetticher/identity/tls/streamdeck.key.pem, -subj, "/CN=client-lab-streamdeck-01.{{ domain }}", -out, /var/lib/boetticher/identity/tls/streamdeck.csr.pem]
  args:
    creates: /var/lib/boetticher/identity/tls/streamdeck.csr.pem

- name: Restrict endpoint-local StreamDeck key and CSR
  ansible.builtin.file:
    path: "{{ item }}"
    owner: streamdeck
    group: streamdeck
    mode: '0600'
  loop:
    - /var/lib/boetticher/identity/tls/streamdeck.key.pem
    - /var/lib/boetticher/identity/tls/streamdeck.csr.pem

- name: Fetch StreamDeck CSR for controller signing
  ansible.builtin.fetch:
    src: /var/lib/boetticher/identity/tls/streamdeck.csr.pem
    dest: "{{ pki_csr_output_dir }}/streamdeck.csr.pem"
    flat: true
  when: pki_bootstrap_phase | default(false) | bool

- name: Install controller-issued StreamDeck client chain and CA
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: streamdeck
    group: streamdeck
    mode: '0644'
  loop:
    - {dest: /var/lib/boetticher/identity/tls/streamdeck.crt.pem, content: "{{ streamdeck_client_cert_pem | default('') }}"}
    - {dest: /var/lib/boetticher/identity/tls/ca.pem, content: "{{ pulse_server_ca_pem }}"}
  when: streamdeck_client_cert_pem | default('') | length > 0
  no_log: true

- name: Render StreamDeck runtime configuration
  ansible.builtin.copy:
    dest: /etc/boetticher/streamdeck.json
    owner: root
    group: streamdeck
    mode: '0640'
    content: "{{ {'pulse_url': 'https://monitor.' + domain, 'brightness': module_configs.streamdeck.brightness, 'refresh_seconds': module_configs.streamdeck.refresh_seconds, 'request_timeout_seconds': module_configs.streamdeck.request_timeout_seconds, 'default_page': module_configs.streamdeck.default_page, 'pinned_guests': module_configs.streamdeck.pinned_guests, 'storage_warning_percent': module_configs.streamdeck.storage_warning_percent, 'storage_critical_percent': module_configs.streamdeck.storage_critical_percent, 'serial': ((usb_export_manifests | selectattr('vmid', 'equalto', 220) | first).exports | first).serial | default(''), 'client_certificate': '/var/lib/boetticher/identity/tls/streamdeck.crt.pem', 'client_key': '/var/lib/boetticher/identity/tls/streamdeck.key.pem', 'ca_certificate': '/var/lib/boetticher/identity/tls/ca.pem'} | to_nice_json }}\n"

- name: Enable StreamDeck only after its scoped credential is installed
  ansible.builtin.systemd_service:
    name: streamdeck-status.service
    enabled: true
    state: started
    daemon_reload: true
  when:
    - streamdeck_client_cert_pem | default('') | length > 0
    - streamdeck_token_install_enabled | default(false) | bool
