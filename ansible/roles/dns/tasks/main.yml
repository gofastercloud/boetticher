---
- name: Require an immutable DNS appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "DNS runtime configuration requires a qualified boetticher appliance artifact"
  when: inventory_hostname in groups.get('dns', [])

- name: Require the generated DNS platform contract
  ansible.builtin.assert:
    that:
      - dns_plan is defined
      - dns_plan.authoritative_implementation == 'PowerDNS Authoritative'
      - dns_plan.authoritative_version == '4.9.17'
      - dns_plan.authoritative_port == '5353'
    fail_msg: "DNS deployment requires the generated PowerDNS, Blocky, and DDNS contract"
  no_log: true
  when: inventory_hostname in groups.get('dns', [])

- name: Require qualified PowerDNS software in the appliance
  ansible.builtin.command:
    argv: [sh, -c, "command -v pdns_server && command -v pdnsutil && command -v sqlite3"]
  changed_when: false
  when: inventory_hostname in groups.get('dns', [])

- name: Check the installed PowerDNS version
  ansible.builtin.command: pdns_server --version
  register: powerdns_version
  changed_when: false
  check_mode: false
  when: inventory_hostname in groups.get('dns', [])

- name: Refuse an unqualified PowerDNS version
  ansible.builtin.assert:
    that: "'4.9.17' in powerdns_version.stdout or '4.9.17' in powerdns_version.stderr"
    fail_msg: "The installed PowerDNS version is not the qualified 4.9.17 release"
  when: inventory_hostname in groups.get('dns', [])

- name: Check whether the PowerDNS database exists
  ansible.builtin.stat:
    path: /var/lib/powerdns/pdns.sqlite3
  register: powerdns_database
  when: inventory_hostname in groups.get('dns', [])

- name: Stop PowerDNS before initializing its local database
  ansible.builtin.service:
    name: pdns
    state: stopped
  when:
    - inventory_hostname in groups.get('dns', [])
    - not powerdns_database.stat.exists

- name: Create the PowerDNS data directory
  ansible.builtin.file:
    path: /var/lib/powerdns
    state: directory
    owner: pdns
    group: pdns
    mode: '0750'
  when: inventory_hostname in groups.get('dns', [])

- name: Initialize the PowerDNS SQLite schema once
  ansible.builtin.shell: >-
    sqlite3 /var/lib/powerdns/pdns.sqlite3
    < /usr/share/doc/pdns-backend-sqlite3/schema.sqlite3.sql
  args:
    creates: /var/lib/powerdns/pdns.sqlite3
  when: inventory_hostname in groups.get('dns', [])

- name: Set PowerDNS database ownership
  ansible.builtin.file:
    path: /var/lib/powerdns/pdns.sqlite3
    owner: pdns
    group: pdns
    mode: '0640'
  when: inventory_hostname in groups.get('dns', [])

- name: Configure PowerDNS authoritative service
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: root
    group: pdns
    mode: '0640'
  notify: restart pdns
  when: inventory_hostname in groups.get('dns', [])

- name: Read current PowerDNS zones on the primary
  ansible.builtin.command: pdnsutil list-all-zones
  register: primary_zones
  changed_when: false
  when: inventory_hostname == 'lab-dns-01'

- name: Create the static and dynamic authoritative zones on the primary
  ansible.builtin.command: >-
    pdnsutil create-zone {{ item }}
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  when:
    - inventory_hostname == 'lab-dns-01'
    - item not in primary_zones.stdout

- name: Read current primary replication zones
  ansible.builtin.command: pdnsutil list-all-zones MASTER
  register: primary_master_zones
  changed_when: false
  when: inventory_hostname == 'lab-dns-01'

- name: Configure authoritative zones for primary replication
  ansible.builtin.command: >-
    pdnsutil set-kind {{ item }} MASTER
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  when:
    - inventory_hostname == 'lab-dns-01'
    - item not in primary_master_zones.stdout

- name: Remove exact malformed PowerDNS NS rrsets from the prior boetticher attempt
  ansible.builtin.shell: |
    set -eu
    records="$(pdnsutil list-zone {{ item }})"
    updated=0
    if printf '%s\n' "$records" | awk '$1 == "{{ item }}.{{ item }}" && $4 == "NS" && ($5 == "lab-dns-01.{{ dns_plan.static_zone }}." || $5 == "lab-dns-02.{{ dns_plan.static_zone }}.") { found=1 } END { exit !found }'; then
      pdnsutil delete-rrset {{ item | quote }} {{ item | quote }} NS
      updated=1
    fi
    if [ "$updated" -eq 1 ]; then
      printf 'updated\n'
    fi
  args:
    executable: /bin/sh
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  register: malformed_ns_rrsets
  changed_when: "'updated' in malformed_ns_rrsets.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Remove exact malformed PowerDNS static rrsets from the prior boetticher attempt
  ansible.builtin.shell: |
    set -eu
    records="$(pdnsutil list-zone {{ dns_plan.static_zone }})"
    updated=0
    {% for item in dns_plan.static_records %}
    if printf '%s\n' "$records" | awk -v wanted_name={{ (item.name ~ '.' ~ dns_plan.static_zone) | quote }} -v wanted_type={{ item.type | quote }} -v wanted_value={{ item.value | quote }} '$1 == wanted_name && $4 == wanted_type && $5 == wanted_value { found=1 } END { exit !found }'; then
      pdnsutil delete-rrset {{ dns_plan.static_zone | quote }} {{ item.name | quote }} {{ item.type | quote }}
      updated=1
    fi
    {% endfor %}
    if [ "$updated" -eq 1 ]; then
      printf 'updated\n'
    fi
  args:
    executable: /bin/sh
  register: malformed_static_rrsets
  changed_when: "'updated' in malformed_static_rrsets.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Initialize authoritative NS records on the primary when changed
  ansible.builtin.shell: |
    set -eu
    zone={{ item | quote }}
    current="$(pdnsutil list-zone "$zone" | awk -v zone="$zone" '
      function normalized(value) { sub(/\.$/, "", value); return value }
      $4 == "NS" && (normalized($1) == normalized(zone) || $1 == "@") { print normalized($5) }
    ' | LC_ALL=C sort)"
    expected="$(printf '%s\n' {{ ('lab-dns-01.' ~ dns_plan.static_zone) | quote }} {{ ('lab-dns-02.' ~ dns_plan.static_zone) | quote }} | LC_ALL=C sort)"
    if [ "$current" != "$expected" ]; then
      pdnsutil replace-rrset "$zone" @ NS 300 {{ ('lab-dns-01.' ~ dns_plan.static_zone ~ '.') | quote }} {{ ('lab-dns-02.' ~ dns_plan.static_zone ~ '.') | quote }}
      printf 'updated\n'
    fi
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  register: authoritative_ns_records
  changed_when: "'updated' in authoritative_ns_records.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Publish model-owned static DNS records to the primary when changed
  ansible.builtin.shell: |
    set -eu
    zone={{ dns_plan.static_zone | quote }}
    records="$(pdnsutil list-zone "$zone")"
    {% for item in dns_plan.static_records %}
    record_name={{ item.name | quote }}
    record_type={{ item.type | quote }}
    record_value={{ item.value | quote }}
    current="$(printf '%s\n' "$records" | awk -v name="$record_name" -v record_type="$record_type" -v wanted="$record_value" '
      function normalized(value) { sub(/\.$/, "", value); return value }
      normalized($1) == normalized(name) && $4 == record_type && normalized($5) == normalized(wanted) { print normalized($5) }
    ' | LC_ALL=C sort)"
    expected="$(printf '%s\n' "$record_value" | LC_ALL=C sort)"
    if [ "$current" != "$expected" ]; then
      pdnsutil replace-rrset "$zone" {{ (item.name | replace('.' ~ dns_plan.static_zone, '')) | quote }} {{ item.type | quote }} 300 "$record_value"
      printf 'updated\n'
    fi
    {% endfor %}
  register: static_dns_records
  changed_when: "'updated' in static_dns_records.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Remove explicitly deleted user DNS records from the primary
  ansible.builtin.command: >-
    pdnsutil delete-rrset {{ dns_plan.static_zone }} {{ item.name }}. {{ item.type }}
  loop: "{{ dns_plan.pending_deletions | default([]) }}"
  when: inventory_hostname == 'lab-dns-01'

- name: Reconcile Kea DDNS metadata on the primary when changed
  ansible.builtin.shell: |
    set -eu
    metadata_values() {
      pdnsutil get-meta "$1" "$2" 2>/dev/null |
        sed -n 's/^[^=]*=[[:space:]]*//p' |
        tr ',' ' ' |
        tr -s '[:space:]' '\n' |
        awk 'NF' |
        LC_ALL=C sort |
        paste -sd ' ' -
    }
    expected_sources="$(printf '%s\n' {% for source in dns_plan.ddns.update_sources %}{{ source | quote }} {% endfor %} | tr -s '[:space:]' '\n' | awk 'NF' | LC_ALL=C sort | paste -sd ' ' -)"
    updated=0
    for zone in {{ item.forward_zone | quote }} {{ item.reverse_zone | quote }}; do
      if [ "$(metadata_values "$zone" ALLOW-DNSUPDATE-FROM)" != "$expected_sources" ]; then
        printf 'boetticher-observation dns-metadata-update %s ALLOW-DNSUPDATE-FROM\n' "$zone"
        pdnsutil set-meta "$zone" ALLOW-DNSUPDATE-FROM {% for source in dns_plan.ddns.update_sources %}{{ source | quote }} {% endfor %}
        updated=1
      fi
      if [ "$(metadata_values "$zone" NOTIFY-DNSUPDATE)" != "1" ]; then
        printf 'boetticher-observation dns-metadata-update %s NOTIFY-DNSUPDATE\n' "$zone"
        pdnsutil set-meta "$zone" NOTIFY-DNSUPDATE 1
        updated=1
      fi
      if [ "$(metadata_values "$zone" TSIG-ALLOW-DNSUPDATE)" != {{ item.tsig_key_name | quote }} ]; then
        printf 'boetticher-observation dns-metadata-update %s TSIG-ALLOW-DNSUPDATE\n' "$zone"
        pdnsutil set-meta "$zone" TSIG-ALLOW-DNSUPDATE {{ item.tsig_key_name | quote }}
        updated=1
      fi
    done
    if [ "$updated" -eq 1 ]; then
      printf 'updated\n'
    fi
  args:
    executable: /bin/sh
  loop: "{{ dns_plan.ddns.zones }}"
  register: ddns_metadata
  changed_when: "'updated' in ddns_metadata.stdout"
  when:
    - inventory_hostname == 'lab-dns-01'
    - dns_plan.ddns.enabled | bool

- name: Read current PowerDNS zones on the secondary
  ansible.builtin.command: pdnsutil list-all-zones
  register: secondary_zones
  changed_when: false
  when: inventory_hostname == 'lab-dns-02'

- name: Configure secondary transfer for each platform zone
  ansible.builtin.command: >-
    pdnsutil create-secondary-zone {{ item }} 10.10.10.10:5353
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  when:
    - inventory_hostname == 'lab-dns-02'
    - item not in secondary_zones.stdout

- name: Assert the qualified Blocky binary is present
  ansible.builtin.command: blocky version
  register: blocky_version
  changed_when: false
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Allow Blocky to traverse its non-secret filtering policy path
  ansible.builtin.file:
    path: /etc/boetticher
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Refuse an unsupported Blocky release
  ansible.builtin.assert:
    that: "'0.34.0' in blocky_version.stdout"
    fail_msg: "The installed Blocky resolver is not the qualified 0.34.0 release"
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Install the canonical Blocky configuration
  ansible.builtin.copy:
    content: "{{ blocky_config }}"
    dest: /etc/blocky/config.yml
    owner: root
    group: root
    mode: '0644'
  notify: restart blocky
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Validate the canonical Blocky configuration with the installed binary
  ansible.builtin.command: blocky validate --config /etc/blocky/config.yml
  changed_when: false
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Enable the qualified Blocky service
  ansible.builtin.service:
    name: blocky
    enabled: true
    state: started
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Enable DNS services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - pdns
  when: inventory_hostname in groups.get('dns', [])
