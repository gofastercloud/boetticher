---
- name: Require an immutable DNS appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "DNS runtime configuration requires a qualified boetticher appliance artifact"
  when: inventory_hostname in groups.get('dns', [])

- name: Require the generated DNS platform contract
  ansible.builtin.assert:
    that:
      - dns_plan is defined
      - dns_plan.authoritative_implementation == 'PowerDNS Authoritative'
      - dns_plan.authoritative_version == '4.9.17'
      - dns_plan.authoritative_port == '5353'
    fail_msg: "DNS deployment requires the generated PowerDNS, Blocky, and DDNS contract"
  no_log: true
  when: inventory_hostname in groups.get('dns', [])

- name: Require qualified PowerDNS software in the appliance
  ansible.builtin.command:
    argv: [sh, -c, "command -v pdns_server && command -v pdnsutil && command -v sqlite3"]
  changed_when: false
  when: inventory_hostname in groups.get('dns', [])

- name: Determine whether this pass owns Smallstep CA convergence
  ansible.builtin.set_fact:
    boetticher_manage_step_ca: "{{ inventory_hostname == 'lab-dns-01' and not (boetticher_skip_step_ca | default(false) | bool) }}"
  when: inventory_hostname == 'lab-dns-01'

- name: Create the unprivileged Smallstep CA service account
  ansible.builtin.user:
    name: boetticher-step-ca
    system: true
    home: /var/lib/boetticher/step-ca
    create_home: false
    shell: /usr/sbin/nologin
  when: boetticher_manage_step_ca

- name: Create the Smallstep CA state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: boetticher-step-ca
    group: boetticher-step-ca
    mode: "{{ item.mode }}"
  loop:
    - {path: /var/lib/boetticher/step-ca, mode: '0750'}
    - {path: /var/lib/boetticher/step-ca/certs, mode: '0750'}
    - {path: /var/lib/boetticher/step-ca/config, mode: '0750'}
    - {path: /var/lib/boetticher/step-ca/db, mode: '0750'}
    - {path: /var/lib/boetticher/step-ca/secrets, mode: '0700'}
  when: boetticher_manage_step_ca

- name: Install the Smallstep CA password
  ansible.builtin.copy:
    content: "{{ step_ca_password }}"
    dest: /var/lib/boetticher/step-ca/secrets/password
    owner: boetticher-step-ca
    group: boetticher-step-ca
    mode: '0600'
  no_log: true
  when: boetticher_manage_step_ca

- name: Initialize the Smallstep CA configuration once
  ansible.builtin.command:
    argv:
      - /usr/local/bin/step
      - ca
      - init
      - --name
      - Boetticher
      - --dns
      - "lab-dns-01.{{ dns_plan.static_zone }}"
      - --address
      - "{{ ansible_host }}:9443"
      - --provisioner
      - boetticher
      - --password-file
      - /var/lib/boetticher/step-ca/secrets/password
      - --provisioner-password-file
      - /var/lib/boetticher/step-ca/secrets/password
      - --acme
  args:
    creates: /var/lib/boetticher/step-ca/config/ca.json
    chdir: /var/lib/boetticher/step-ca
  register: step_ca_init
  environment:
    STEPPATH: /var/lib/boetticher/step-ca
  no_log: true
  when: boetticher_manage_step_ca

- name: Remove the generated Smallstep root private key from the online CA
  ansible.builtin.file:
    path: /var/lib/boetticher/step-ca/secrets/root_ca_key
    state: absent
  when: boetticher_manage_step_ca

- name: Set Smallstep CA state ownership for the unprivileged service
  ansible.builtin.file:
    path: /var/lib/boetticher/step-ca
    owner: boetticher-step-ca
    group: boetticher-step-ca
    recurse: true
  when: boetticher_manage_step_ca

- name: Install the cold-root public certificate for Smallstep
  ansible.builtin.copy:
    content: "{{ step_ca_root_cert_pem }}"
    dest: /var/lib/boetticher/step-ca/certs/root_ca.crt
    owner: boetticher-step-ca
    group: boetticher-step-ca
    mode: '0644'
  no_log: true
  when: boetticher_manage_step_ca

- name: Install the online Smallstep intermediate certificate
  ansible.builtin.copy:
    content: "{{ step_ca_intermediate_cert_pem }}"
    dest: /var/lib/boetticher/step-ca/certs/intermediate_ca.crt
    owner: boetticher-step-ca
    group: boetticher-step-ca
    mode: '0644'
  no_log: true
  when: boetticher_manage_step_ca

- name: Check whether the online Smallstep intermediate key is already encrypted
  ansible.builtin.shell: >-
    grep -Fq 'BEGIN ENCRYPTED PRIVATE KEY'
    /var/lib/boetticher/step-ca/secrets/intermediate_ca_key
  register: step_ca_key_encrypted
  changed_when: false
  failed_when: false
  when: boetticher_manage_step_ca

- name: Import and encrypt the online Smallstep intermediate key once
  block:
    - name: Write the current intermediate key for one-time conversion
      ansible.builtin.copy:
        content: "{{ step_ca_intermediate_key_pem }}"
        dest: /var/lib/boetticher/step-ca/secrets/intermediate_ca_key
        owner: boetticher-step-ca
        group: boetticher-step-ca
        mode: '0600'
      no_log: true
    - name: Encrypt the online intermediate key with the CA password
      ansible.builtin.command:
        argv:
          - /usr/local/bin/step
          - crypto
          - change-pass
          - /var/lib/boetticher/step-ca/secrets/intermediate_ca_key
          - --new-password-file
          - /var/lib/boetticher/step-ca/secrets/password
          - --force
      environment:
        STEPPATH: /var/lib/boetticher/step-ca
      no_log: true
  rescue:
    - name: Remove a failed intermediate-key conversion
      ansible.builtin.file:
        path: /var/lib/boetticher/step-ca/secrets/intermediate_ca_key
        state: absent
    - name: Stop deployment after failed intermediate-key conversion
      ansible.builtin.fail:
        msg: "Smallstep intermediate key conversion failed; no online CA was started"
  when:
    - boetticher_manage_step_ca
    - step_ca_key_encrypted.rc != 0 or step_ca_init.changed

- name: Install the Smallstep CA service
  ansible.builtin.template:
    src: step-ca.service.j2
    dest: /etc/systemd/system/boetticher-step-ca.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when: boetticher_manage_step_ca

- name: Enable the Smallstep CA service
  ansible.builtin.systemd_service:
    name: boetticher-step-ca
    enabled: true
    state: started
    daemon_reload: true
  when: boetticher_manage_step_ca

- name: Check the installed PowerDNS version
  ansible.builtin.command: pdns_server --version
  register: powerdns_version
  changed_when: false
  check_mode: false
  when: inventory_hostname in groups.get('dns', [])

- name: Refuse an unqualified PowerDNS version
  ansible.builtin.assert:
    that: "'4.9.17' in powerdns_version.stdout or '4.9.17' in powerdns_version.stderr"
    fail_msg: "The installed PowerDNS version is not the qualified 4.9.17 release"
  when: inventory_hostname in groups.get('dns', [])

- name: Check whether the PowerDNS database exists
  ansible.builtin.stat:
    path: /var/lib/powerdns/pdns.sqlite3
  register: powerdns_database
  when: inventory_hostname in groups.get('dns', [])

- name: Stop PowerDNS before initializing its local database
  ansible.builtin.service:
    name: pdns
    state: stopped
  when:
    - inventory_hostname in groups.get('dns', [])
    - not powerdns_database.stat.exists

- name: Create the PowerDNS data directory
  ansible.builtin.file:
    path: /var/lib/powerdns
    state: directory
    owner: pdns
    group: pdns
    mode: '0750'
  when: inventory_hostname in groups.get('dns', [])

- name: Initialize the PowerDNS SQLite schema once
  ansible.builtin.shell: >-
    sqlite3 /var/lib/powerdns/pdns.sqlite3
    < /usr/share/doc/pdns-backend-sqlite3/schema.sqlite3.sql
  args:
    creates: /var/lib/powerdns/pdns.sqlite3
  when: inventory_hostname in groups.get('dns', [])

- name: Set PowerDNS database ownership
  ansible.builtin.file:
    path: /var/lib/powerdns/pdns.sqlite3
    owner: pdns
    group: pdns
    mode: '0640'
  when: inventory_hostname in groups.get('dns', [])

- name: Configure PowerDNS authoritative service
  ansible.builtin.template:
    src: pdns.conf.j2
    dest: /etc/powerdns/pdns.conf
    owner: root
    group: pdns
    mode: '0640'
  notify: restart pdns
  when: inventory_hostname in groups.get('dns', [])

- name: Read current PowerDNS zones on the primary
  ansible.builtin.command: pdnsutil list-all-zones
  register: primary_zones
  changed_when: false
  when: inventory_hostname == 'lab-dns-01'

- name: Create the static and dynamic authoritative zones on the primary
  ansible.builtin.command: >-
    pdnsutil create-zone {{ item }}
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  when:
    - inventory_hostname == 'lab-dns-01'
    - item not in primary_zones.stdout

- name: Read current primary replication zones
  ansible.builtin.command: pdnsutil list-all-zones MASTER
  register: primary_master_zones
  changed_when: false
  when: inventory_hostname == 'lab-dns-01'

- name: Configure authoritative zones for primary replication
  ansible.builtin.command: >-
    pdnsutil set-kind {{ item }} MASTER
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  when:
    - inventory_hostname == 'lab-dns-01'
    - item not in primary_master_zones.stdout

- name: Remove exact malformed PowerDNS NS rrsets from the prior boetticher attempt
  ansible.builtin.shell: |
    set -eu
    records="$(pdnsutil list-zone {{ item }})"
    updated=0
    if printf '%s\n' "$records" | awk '$1 == "{{ item }}.{{ item }}" && $4 == "NS" && $5 == "lab-dns-01.{{ dns_plan.static_zone }}." { found=1 } END { exit !found }'; then
      pdnsutil delete-rrset {{ item | quote }} {{ item | quote }} NS
      updated=1
    fi
    if [ "$updated" -eq 1 ]; then
      printf 'updated\n'
    fi
  args:
    executable: /bin/sh
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  register: malformed_ns_rrsets
  changed_when: "'updated' in malformed_ns_rrsets.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Remove exact malformed PowerDNS static rrsets from the prior boetticher attempt
  ansible.builtin.shell: |
    set -eu
    records="$(pdnsutil list-zone {{ dns_plan.static_zone }})"
    updated=0
    {% for item in dns_plan.static_records %}
    if printf '%s\n' "$records" | awk -v wanted_name={{ (item.name ~ '.' ~ dns_plan.static_zone) | quote }} -v wanted_type={{ item.type | quote }} -v wanted_value={{ item.value | quote }} '$1 == wanted_name && $4 == wanted_type && $5 == wanted_value { found=1 } END { exit !found }'; then
      pdnsutil delete-rrset {{ dns_plan.static_zone | quote }} {{ item.name | quote }} {{ item.type | quote }}
      updated=1
    fi
    {% endfor %}
    if [ "$updated" -eq 1 ]; then
      printf 'updated\n'
    fi
  args:
    executable: /bin/sh
  register: malformed_static_rrsets
  changed_when: "'updated' in malformed_static_rrsets.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Initialize authoritative NS records on the primary when changed
  ansible.builtin.shell: |
    set -eu
    zone={{ item | quote }}
    current="$(pdnsutil list-zone "$zone" | awk -v zone="$zone" '
      function normalized(value) { sub(/\.$/, "", value); return value }
      $4 == "NS" && (normalized($1) == normalized(zone) || $1 == "@") { print normalized($5) }
    ' | LC_ALL=C sort)"
    expected="$(printf '%s\n' {{ ('lab-dns-01.' ~ dns_plan.static_zone) | quote }} | LC_ALL=C sort)"
    if [ "$current" != "$expected" ]; then
      pdnsutil replace-rrset "$zone" @ NS 300 {{ ('lab-dns-01.' ~ dns_plan.static_zone ~ '.') | quote }}
      printf 'updated\n'
    fi
  loop: "{{ [dns_plan.static_zone] + (dns_plan.dynamic_zones | map(attribute='name') | list) + (dns_plan.reverse_zones | map(attribute='name') | list) }}"
  register: authoritative_ns_records
  changed_when: "'updated' in authoritative_ns_records.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Publish model-owned static DNS records to the primary when changed
  ansible.builtin.shell: |
    set -eu
    zone={{ dns_plan.static_zone | quote }}
    records="$(pdnsutil list-zone "$zone")"
    {% for item in dns_plan.static_records %}
    record_name={{ item.name | quote }}
    record_type={{ item.type | quote }}
    record_value={{ item.value | quote }}
    current="$(printf '%s\n' "$records" | awk -v name="$record_name" -v record_type="$record_type" -v wanted="$record_value" '
      function normalized(value) { sub(/\.$/, "", value); return value }
      normalized($1) == normalized(name) && $4 == record_type && normalized($5) == normalized(wanted) { print normalized($5) }
    ' | LC_ALL=C sort)"
    expected="$(printf '%s\n' "$record_value" | LC_ALL=C sort)"
    if [ "$current" != "$expected" ]; then
      pdnsutil replace-rrset "$zone" {{ (item.name | replace('.' ~ dns_plan.static_zone, '')) | quote }} {{ item.type | quote }} 300 "$record_value"
      printf 'updated\n'
    fi
    {% endfor %}
  register: static_dns_records
  changed_when: "'updated' in static_dns_records.stdout"
  when: inventory_hostname == 'lab-dns-01'

- name: Remove explicitly deleted user DNS records from the primary
  ansible.builtin.command: >-
    pdnsutil delete-rrset {{ dns_plan.static_zone }} {{ item.name }}. {{ item.type }}
  loop: "{{ dns_plan.pending_deletions | default([]) }}"
  when: inventory_hostname == 'lab-dns-01'

- name: Reconcile Kea DDNS metadata on the primary when changed
  ansible.builtin.shell: |
    set -eu
    metadata_values() {
      pdnsutil get-meta "$1" "$2" 2>/dev/null |
        sed -n 's/^[^=]*=[[:space:]]*//p' |
        tr ',' ' ' |
        tr -s '[:space:]' '\n' |
        awk 'NF' |
        LC_ALL=C sort |
        paste -sd ' ' -
    }
    metadata_token_metrics() {
      printf '%s\n' "$1" |
        awk '{ for (i = 1; i <= NF; i++) print $i }' |
        while IFS= read -r token; do
          [ -n "$token" ] || continue
          token_length="$(printf '%s' "$token" | wc -c | tr -d '[:space:]')"
          token_digest="$(printf '%s' "$token" | sha256sum | cut -c1-8)"
          printf '%s:%s\n' "$token_length" "$token_digest"
        done |
        paste -sd ',' -
    }
    expected_sources="$(printf '%s\n' {% for source in dns_plan.ddns.update_sources %}{{ source | quote }} {% endfor %} | tr -s '[:space:]' '\n' | awk 'NF' | LC_ALL=C sort | paste -sd ' ' -)"
    updated=0
    for zone in {{ item.forward_zone | quote }} {{ item.reverse_zone | quote }}; do
      current_sources="$(metadata_values "$zone" ALLOW-DNSUPDATE-FROM)"
      if [ "$current_sources" != "$expected_sources" ]; then
        current_length="$(printf '%s' "$current_sources" | wc -c | tr -d '[:space:]')"
        current_count="$(printf '%s\n' "$current_sources" | awk '{print NF}')"
        current_digest="$(printf '%s' "$current_sources" | sha256sum | cut -c1-16)"
        current_tokens="$(metadata_token_metrics "$current_sources")"
        [ -n "$current_tokens" ] || current_tokens=none
        printf 'boetticher-observation dns-metadata-drift %s ALLOW-DNSUPDATE-FROM %s %s %s %s\n' "$zone" "$current_length" "$current_count" "$current_digest" "$current_tokens"
        pdnsutil set-meta "$zone" ALLOW-DNSUPDATE-FROM {% for source in dns_plan.ddns.update_sources %}{{ source | quote }} {% endfor %};
        updated=1
      fi
      current_notify="$(metadata_values "$zone" NOTIFY-DNSUPDATE)"
      if [ "$current_notify" != "1" ]; then
        current_length="$(printf '%s' "$current_notify" | wc -c | tr -d '[:space:]')"
        current_count="$(printf '%s\n' "$current_notify" | awk '{print NF}')"
        current_digest="$(printf '%s' "$current_notify" | sha256sum | cut -c1-16)"
        current_tokens="$(metadata_token_metrics "$current_notify")"
        [ -n "$current_tokens" ] || current_tokens=none
        printf 'boetticher-observation dns-metadata-drift %s NOTIFY-DNSUPDATE %s %s %s %s\n' "$zone" "$current_length" "$current_count" "$current_digest" "$current_tokens"
        pdnsutil set-meta "$zone" NOTIFY-DNSUPDATE 1
        updated=1
      fi
      current_tsig="$(metadata_values "$zone" TSIG-ALLOW-DNSUPDATE)"
      if [ "$current_tsig" != {{ item.tsig_key_name | quote }} ]; then
        current_length="$(printf '%s' "$current_tsig" | wc -c | tr -d '[:space:]')"
        current_count="$(printf '%s\n' "$current_tsig" | awk '{print NF}')"
        current_digest="$(printf '%s' "$current_tsig" | sha256sum | cut -c1-16)"
        current_tokens="$(metadata_token_metrics "$current_tsig")"
        [ -n "$current_tokens" ] || current_tokens=none
        printf 'boetticher-observation dns-metadata-drift %s TSIG-ALLOW-DNSUPDATE %s %s %s %s\n' "$zone" "$current_length" "$current_count" "$current_digest" "$current_tokens"
        pdnsutil set-meta "$zone" TSIG-ALLOW-DNSUPDATE {{ item.tsig_key_name | quote }}
        updated=1
      fi
    done
    if [ "$updated" -eq 1 ]; then
      printf 'updated\n'
    fi
  args:
    executable: /bin/sh
  loop: "{{ dns_plan.ddns.zones }}"
  register: ddns_metadata
  changed_when: "'updated' in ddns_metadata.stdout"
  when:
    - inventory_hostname == 'lab-dns-01'
    - dns_plan.ddns.enabled | bool

- name: Assert the qualified Blocky binary is present
  ansible.builtin.command: blocky version
  register: blocky_version
  changed_when: false
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Allow Blocky to traverse its non-secret filtering policy path
  ansible.builtin.file:
    path: /etc/boetticher
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Refuse an unsupported Blocky release
  ansible.builtin.assert:
    that: "'0.34.0' in blocky_version.stdout"
    fail_msg: "The installed Blocky resolver is not the qualified 0.34.0 release"
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Install the canonical Blocky configuration
  ansible.builtin.copy:
    content: "{{ blocky_config }}"
    dest: /etc/blocky/config.yml
    owner: root
    group: root
    mode: '0644'
  notify: restart blocky
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Validate the canonical Blocky configuration with the installed binary
  ansible.builtin.command: blocky validate --config /etc/blocky/config.yml
  changed_when: false
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Enable the qualified Blocky service
  ansible.builtin.service:
    name: blocky
    enabled: true
    state: started
  when:
    - inventory_hostname in groups.get('dns', [])

- name: Enable DNS services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - pdns
  when: inventory_hostname in groups.get('dns', [])
