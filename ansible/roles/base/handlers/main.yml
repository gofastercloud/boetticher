---
- name: restart journald
  ansible.builtin.service:
    name: systemd-journald
    state: restarted

- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart pulse-agent
  ansible.builtin.systemd_service:
    name: pulse-agent
    state: restarted
    daemon_reload: true
