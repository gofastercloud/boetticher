---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - jq
      - chrony
      - nginx
      - openssl
      - systemd-journal-remote
    state: present
    # The Proxmox host may have the vendor enterprise repository enabled
    # without a subscription. Host bootstrap owns the required package
    # baseline; do not make routine convergence depend on that repository's
    # authenticated index.
    update_cache: "{{ inventory_hostname not in groups.get('proxmox', []) }}"
    cache_valid_time: "{{ 0 if inventory_hostname in groups.get('proxmox', []) else 3600 }}"
  when:
    - inventory_hostname in groups.get('proxmox', [])
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Remove labadmin from the sudo group
  ansible.builtin.command: gpasswd --delete labadmin sudo
  register: remove_labadmin_sudo_group
  changed_when: remove_labadmin_sudo_group.rc == 0
  failed_when: remove_labadmin_sudo_group.rc not in [0, 3]
  when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Remove legacy labadmin sudo policy
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/sudoers.d/boetticher
    - /etc/sudoers.d/boetticher-labadmin
  when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Allow endpoint services to traverse the boetticher runtime state path
  ansible.builtin.file:
    path: /var/lib/boetticher
    state: directory
    owner: root
    group: systemd-journal
    # Child service directories remain separately protected. Execute access
    # for other users permits traversal without directory listing or reads.
    mode: '0751'
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Allow endpoint services to traverse the boetticher identity path
  ansible.builtin.file:
    path: /var/lib/boetticher/identity
    state: directory
    owner: root
    group: systemd-journal
    mode: '0750'
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Disable the restricted Chrony service in appliances
  ansible.builtin.service:
    name: chronyd-restricted.service
    enabled: false
    state: stopped
  when:
    - inventory_hostname not in groups.get('proxmox', [])
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Configure appliances to use the platform DNS pair
  ansible.builtin.copy:
    content: "{% for nameserver in appliance_resolvers.get(inventory_hostname, dns_plan.nameservers) %}nameserver {{ nameserver }}\n{% endfor %}"
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname not in groups.get('proxmox', [])
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Pin the Core CA on the gateway without primary recursive DNS
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^.*\slab-dns-01\.{{ domain | regex_escape }}\s*# boetticher-core-ca$'
    line: '10.10.10.10 lab-dns-01.{{ domain }} # boetticher-core-ca'
    create: true
  when: inventory_hostname in groups.get('firewall', [])

- name: Pin the Proxmox collector hostname to the managed logging appliance
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^\s*{{ logging_plan.collector_address | regex_escape }}\s+'
    line: "{{ logging_plan.collector_address }} logs.{{ domain }}"
    state: present
    create: true
  when:
    - inventory_hostname in groups.get('proxmox', [])
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Install bounded local journald configuration
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Write bounded local journald configuration
  ansible.builtin.copy:
    content: "[Journal]\nSystemMaxUse=256M\nRuntimeMaxUse=64M\n"
    dest: /etc/systemd/journald.conf.d/boetticher.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart journald
  when: boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Create endpoint-local logging identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/logging
    state: directory
    owner: root
    group: systemd-journal
    mode: '0750'
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Issue and renew the endpoint-local logging client certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: "logging {{ inventory_hostname }}"
    step_ca_endpoint_subject: "client-{{ inventory_hostname }}.{{ domain }}"
    step_ca_endpoint_sans: []
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/logging/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/logging/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: "/var/lib/boetticher/identity/logging/{{ inventory_hostname }}.crt"
    step_ca_endpoint_key_path: "/var/lib/boetticher/identity/logging/{{ inventory_hostname }}.key"
    step_ca_endpoint_marker_path: "/var/lib/boetticher/identity/logging/{{ inventory_hostname }}.step-ca"
    step_ca_endpoint_renewal_script: "/usr/local/sbin/boetticher-renew-logging-{{ inventory_hostname }}"
    step_ca_endpoint_renewal_service: "/etc/systemd/system/boetticher-renew-logging-{{ inventory_hostname }}.service"
    step_ca_endpoint_renewal_timer: "/etc/systemd/system/boetticher-renew-logging-{{ inventory_hostname }}.timer"
    step_ca_endpoint_reload_service: systemd-journal-upload
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/logging /run
    step_ca_endpoint_certificate_group: systemd-journal
    step_ca_endpoint_certificate_mode: '0640'
    step_ca_endpoint_key_group: systemd-journal
    step_ca_endpoint_key_mode: '0640'
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Check whether the endpoint-local logging certificate is ready
  ansible.builtin.stat:
    path: "/var/lib/boetticher/identity/logging/{{ inventory_hostname }}.crt"
  register: logging_client_certificate_ready
  when: inventory_hostname in (logging_upload_configs | default({}))

- name: Install the platform CA for endpoint journal upload
  ansible.builtin.copy:
    content: "{{ client_ca_pem }}"
    dest: /var/lib/boetticher/identity/logging/ca.crt
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Install the asynchronous journal-upload configuration skeleton
  ansible.builtin.copy:
    content: "{{ logging_upload_configs[inventory_hostname] }}"
    dest: /etc/systemd/journal-upload.conf
    owner: root
    group: root
    mode: '0644'
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Install bounded journal-upload retry policy
  block:
    - name: Create journal-upload service drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/systemd-journal-upload.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Write journal-upload retry policy
      ansible.builtin.copy:
        content: "[Service]\nRestartSec=15s\n"
        dest: /etc/systemd/system/systemd-journal-upload.service.d/boetticher.conf
        owner: root
        group: root
        mode: '0644'

    - name: Reload systemd after installing journal-upload policy
      ansible.builtin.systemd:
        daemon_reload: true
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']

- name: Enable asynchronous journal upload after endpoint certificate installation
  ansible.builtin.service:
    name: systemd-journal-upload
    enabled: true
    state: started
  when:
    - inventory_hostname in (logging_upload_configs | default({}))
    - logging_client_certificate_ready.stat.exists | default(false)
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap', 'services']

- name: Create declared systemd credential drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item.key }}.d"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ (credential_dropins[inventory_hostname] | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: boetticher_deploy_phase | default('full') != 'services'

- name: Install declared systemd credential drop-ins
  ansible.builtin.copy:
    content: "{{ item.value }}"
    dest: "/etc/systemd/system/{{ item.key }}.d/boetticher-credentials.conf"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ (credential_dropins[inventory_hostname] | default({})) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: boetticher_credential_dropin_install
  notify: reload systemd
  when: boetticher_deploy_phase | default('full') != 'services'

- name: Activate the firewall Kea DDNS credential drop-in
  ansible.builtin.systemd_service:
    name: kea-dhcp-ddns-server.service
    state: restarted
    daemon_reload: true
  when:
    - inventory_hostname in groups.get('firewall', [])
    - boetticher_deploy_phase | default('full') in ['full', 'bootstrap']
    - credential_dropins[inventory_hostname]['kea-dhcp-ddns-server.service'] is defined
