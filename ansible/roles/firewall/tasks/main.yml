---
- name: Require an immutable firewall appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Firewall runtime configuration requires a qualified boetticher appliance artifact"

- name: Require the managed gateway contract
  ansible.builtin.assert:
    that:
      - firewall_plan is defined
      - firewall_plan.mode == 'managed'
      - firewall_ruleset is defined
      - firewall_ruleset | length > 0
      - firewall_ruleset_sha256 is defined
      - firewall_ruleset_sha256 is match('^[0-9a-f]{64}$')
  no_log: true

- name: Allow Kea DDNS to read its systemd credential
  ansible.builtin.copy:
    content: "/run/credentials/kea-dhcp-ddns-server.service/kea-ddns-tsig r,\n"
    dest: /etc/apparmor.d/local/usr.sbin.kea-dhcp-ddns
    owner: root
    group: root
    mode: '0644'
  notify: reload AppArmor

- name: Permit read-only Kea lease evidence
  ansible.builtin.copy:
    content: "labadmin ALL=(root) NOPASSWD: /bin/cat /var/lib/kea/kea-leases4.csv\n"
    dest: /etc/sudoers.d/boetticher-kea-leases
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s

- name: Require qualified gateway software in the appliance
  ansible.builtin.command:
    argv: [sh, -c, "command -v nft && command -v kea-dhcp4 && command -v kea-dhcp-ddns && command -v dnsmasq"]
  changed_when: false

- name: Require the firewall telemetry appliance contract
  ansible.builtin.command:
    argv: [sh, -c, "id boetticher-telemetry && test -x /usr/lib/boetticher/boetticher-firewall-telemetry && test -x /usr/lib/boetticher/snapshot-firewall && test -f /etc/systemd/system/boetticher-firewall-telemetry.service && test -f /etc/systemd/system/boetticher-firewall-snapshot.timer"]
  changed_when: false

- name: Create the firewall telemetry state directory
  ansible.builtin.file:
    path: /var/lib/boetticher/firewall-telemetry
    state: directory
    owner: boetticher-telemetry
    group: boetticher-telemetry
    mode: '0750'

- name: Disable forwarding before gateway convergence
  ansible.builtin.copy:
    content: |
      net.ipv4.ip_forward=0
      net.ipv6.conf.all.forwarding=0
      net.ipv6.conf.default.forwarding=0
    dest: /etc/sysctl.d/99-boetticher-gateway.conf
    owner: root
    group: root
    mode: '0644'

- name: Apply fail-closed forwarding settings
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=0, net.ipv6.conf.all.forwarding=0, net.ipv6.conf.default.forwarding=0]
  changed_when: true

- name: Check managed gateway interface configuration for drift
  ansible.builtin.shell: |
    set -u
    needs_convergence=0
    check_file() {
      path="$1"
      expected="$2"
      if [ -L "$path" ]; then
        needs_convergence=1
        return
      fi
      actual="$(sha256sum "$path" 2>/dev/null | awk '{print $1}' || true)"
      metadata="$(stat -c '%U:%G:%a' "$path" 2>/dev/null || true)"
      if [ "$actual" != "$expected" ] || [ "$metadata" != "root:root:644" ]; then
        needs_convergence=1
      fi
    }
    {% for item in firewall_plan.interfaces %}
    check_file {{ ('/etc/systemd/network/10-boetticher-' ~ item.name ~ '.link') | quote }} {{ firewall_interface_config_digests[item.name].link | quote }}
    check_file {{ ('/etc/systemd/network/20-boetticher-' ~ item.name ~ '.network') | quote }} {{ firewall_interface_config_digests[item.name].network | quote }}
    {% endfor %}
    exit "$needs_convergence"
  args:
    executable: /bin/sh
  register: firewall_interface_state
  changed_when: false
  failed_when: false

- name: Configure role-oriented gateway link names
  ansible.builtin.template:
    src: boetticher.link.j2
    dest: "/etc/systemd/network/10-boetticher-{{ item.name }}.link"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ firewall_plan.interfaces }}"
  notify: restart systemd-networkd
  when: firewall_interface_state.rc != 0

- name: Configure gateway network interfaces
  ansible.builtin.template:
    src: boetticher.network.j2
    dest: "/etc/systemd/network/20-boetticher-{{ item.name }}.network"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ firewall_plan.interfaces }}"
  notify: restart systemd-networkd
  when: firewall_interface_state.rc != 0

- name: Enable systemd-networkd
  ansible.builtin.service:
    name: systemd-networkd
    enabled: true
    state: started

- name: Load credential drop-ins before starting gateway services
  ansible.builtin.meta: flush_handlers

- name: Install source-based AirVPN policy routing helpers
  ansible.builtin.template:
    src: boetticher-policy-routing-up.j2
    dest: /usr/lib/boetticher/policy-routing-up
    owner: root
    group: root
    mode: '0750'
  when: firewall_plan.policy_routes | default([]) | length > 0

- name: Install AirVPN policy routing cleanup helper
  ansible.builtin.template:
    src: boetticher-policy-routing-down.j2
    dest: /usr/lib/boetticher/policy-routing-down
    owner: root
    group: root
    mode: '0750'
  when: firewall_plan.policy_routes | default([]) | length > 0

- name: Install the AirVPN source-policy routing service
  ansible.builtin.template:
    src: boetticher-policy-routing.service.j2
    dest: /etc/systemd/system/boetticher-policy-routing.service
    owner: root
    group: root
    mode: '0644'
  when: firewall_plan.policy_routes | default([]) | length > 0

- name: Enable AirVPN source-policy routing before forwarding
  ansible.builtin.systemd_service:
    name: boetticher-policy-routing.service
    enabled: true
    state: restarted
    daemon_reload: true
  when: firewall_plan.policy_routes | default([]) | length > 0

- name: Check for an obsolete AirVPN source-policy routing service
  ansible.builtin.stat:
    path: /etc/systemd/system/boetticher-policy-routing.service
  register: obsolete_policy_routing_service
  when: firewall_plan.policy_routes | default([]) | length == 0

- name: Stop obsolete AirVPN source-policy routing
  ansible.builtin.systemd_service:
    name: boetticher-policy-routing.service
    enabled: false
    state: stopped
    daemon_reload: true
  when:
    - firewall_plan.policy_routes | default([]) | length == 0
    - obsolete_policy_routing_service.stat.exists | default(false)

- name: Remove obsolete AirVPN source-policy routing rules
  ansible.builtin.command:
    argv:
      - sh
      - -c
      - >-
        set -eu;
        for priority in $(ip -4 rule show | awk '$NF == 51820 {gsub(":", "", $1); print $1}'); do
        ip -4 rule del priority "$priority";
        done;
        route_status=0;
        route_output=$(ip -4 route flush table 51820 2>&1) || route_status=$?;
        if [ "$route_status" -ne 0 ] && ! printf '%s\n' "$route_output" | grep -Fq 'FIB table does not exist'; then
        printf '%s\n' "$route_output" >&2;
        exit "$route_status";
        fi
  changed_when: false
  when: firewall_plan.policy_routes | default([]) | length == 0

- name: Remove obsolete AirVPN source-policy routing files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /usr/lib/boetticher/policy-routing-up
    - /usr/lib/boetticher/policy-routing-down
    - /etc/systemd/system/boetticher-policy-routing.service
  when: firewall_plan.policy_routes | default([]) | length == 0

- name: Create nftables configuration directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Check the managed gateway nftables ruleset for drift
  ansible.builtin.shell: |
    set -u
    path=/etc/nftables.d/boetticher.nft
    if [ -L "$path" ]; then
      exit 1
    fi
    actual="$(sha256sum "$path" 2>/dev/null | awk '{print $1}' || true)"
    metadata="$(stat -c '%U:%G:%a' "$path" 2>/dev/null || true)"
    if [ "$actual" = {{ firewall_ruleset_sha256 | quote }} ] && [ "$metadata" = "root:root:600" ]; then
      exit 0
    fi
    exit 1
  args:
    executable: /bin/sh
  register: firewall_ruleset_state
  changed_when: false
  failed_when: false

- name: Install the candidate boetticher nftables ruleset
  ansible.builtin.copy:
    content: "{{ firewall_ruleset }}"
    dest: /run/boetticher.nft.new
    owner: root
    group: root
    mode: '0600'
  when: firewall_ruleset_state.rc != 0

- name: Validate the candidate boetticher nftables ruleset
  ansible.builtin.command:
    argv: [nft, -c, -f, /run/boetticher.nft.new]
  changed_when: false
  when: firewall_ruleset_state.rc != 0

- name: Keep the last known-good boetticher nftables ruleset
  ansible.builtin.copy:
    remote_src: true
    src: /etc/nftables.d/boetticher.nft
    dest: /run/boetticher.nft.previous
    owner: root
    group: root
    mode: '0600'
  failed_when: false
  when: firewall_ruleset_state.rc != 0

- name: Install the validated boetticher nftables ruleset atomically
  ansible.builtin.copy:
    remote_src: true
    src: /run/boetticher.nft.new
    dest: /etc/nftables.d/boetticher.nft
    owner: root
    group: root
    mode: '0600'
  notify: reload boetticher nftables
  when: firewall_ruleset_state.rc != 0

- name: Configure nftables to load the boetticher ruleset
  ansible.builtin.copy:
    content: "include \"/etc/nftables.d/boetticher.nft\"\n"
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload boetticher nftables

- name: Apply the validated ruleset before enabling forwarding
  ansible.builtin.command:
    argv: [nft, -f, /etc/nftables.d/boetticher.nft]
  changed_when: true

- name: Configure Kea DHCPv4 and D2
  ansible.builtin.template:
    src: kea-dhcp4.conf.j2
    dest: /etc/kea/kea-dhcp4.conf
    owner: root
    group: _kea
    mode: '0640'
  no_log: true
  notify: restart Kea DHCPv4

- name: Configure Kea DHCP-DDNS
  ansible.builtin.template:
    src: kea-dhcp-ddns.conf.j2
    dest: /etc/kea/kea-dhcp-ddns.conf
    owner: root
    group: _kea
    mode: '0640'
  no_log: true
  notify: restart Kea DHCP-DDNS

- name: Configure SANDBOX-only DNS forwarding
  ansible.builtin.template:
    src: dnsmasq.conf.j2
    dest: /etc/dnsmasq.d/boetticher-sandbox.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart dnsmasq

- name: Enable gateway services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - nftables
    - kea-dhcp4-server
    - kea-dhcp-ddns-server
    - dnsmasq

- name: Enable the firewall telemetry snapshot timer
  ansible.builtin.systemd_service:
    name: boetticher-firewall-snapshot.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Enable the firewall telemetry API
  ansible.builtin.systemd_service:
    name: boetticher-firewall-telemetry.service
    enabled: true
    state: started

- name: Flush gateway handlers before enabling forwarding
  ansible.builtin.meta: flush_handlers

- name: Install the boot-time forwarding readiness gate
  ansible.builtin.template:
    src: boetticher-forwarding.service.j2
    dest: /etc/systemd/system/boetticher-forwarding.service
    owner: root
    group: root
    mode: '0644'

- name: Enable IPv4 forwarding only after policy and services are ready
  ansible.builtin.systemd_service:
    name: boetticher-forwarding.service
    enabled: true
    state: started
    daemon_reload: true

- name: Reassert IPv4 forwarding after the readiness gate
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=1]
  changed_when: false
