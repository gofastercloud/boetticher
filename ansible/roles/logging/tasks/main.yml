---
- name: Require an immutable logging appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Logging runtime configuration requires a qualified boetticher appliance artifact"
  when: inventory_hostname == logging_plan.collector

- name: Require current client revocation material for the logging boundary
  ansible.builtin.assert:
    that:
      - step_ca_root_cert_pem is defined
      - step_ca_intermediate_cert_pem is defined
      - client_ca_pem is defined
      - client_ca_pem | length > 0
      - client_crl_pem is defined
      - client_crl_pem | length > 0
    fail_msg: "Logging TLS requires Smallstep server trust and retained client CA/CRL"
  no_log: true
  when: inventory_hostname == logging_plan.collector

- name: Install the bounded collector journal directory
  ansible.builtin.file:
    path: "{{ logging_plan.remote_journal_path }}"
    state: directory
    owner: root
    group: systemd-journal-remote
    mode: '2770'
  when: inventory_hostname == logging_plan.collector

- name: Grant the managed administrator read access to collected journals
  ansible.builtin.user:
    name: labadmin
    groups: systemd-journal-remote
    append: true
  when: inventory_hostname == logging_plan.collector

- name: Create collector logging identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/logging
    state: directory
    owner: root
    group: systemd-journal-remote
    mode: '0750'
  when: inventory_hostname == logging_plan.collector

- name: Issue and renew the logging collector certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: Logging collector
    step_ca_endpoint_subject: "logs.{{ domain }}"
    step_ca_endpoint_sans: ["logs.{{ domain }}", "{{ logging_plan.collector }}.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/logging/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/logging/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/logging/collector.crt
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/logging/collector.key
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/logging/collector.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-logging-collector-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-logging-collector-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-logging-collector-certificate.timer
    step_ca_endpoint_reload_service: nginx
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/logging /run
    step_ca_endpoint_certificate_group: systemd-journal-remote
    step_ca_endpoint_certificate_mode: '0640'
    step_ca_endpoint_key_group: systemd-journal-remote
    step_ca_endpoint_key_mode: '0640'
  when: inventory_hostname == logging_plan.collector

- name: Check whether the logging collector certificate is ready
  ansible.builtin.stat:
    path: /var/lib/boetticher/identity/logging/collector.crt
  register: logging_collector_certificate_ready
  when: inventory_hostname == logging_plan.collector

- name: Install the platform CA for the collector
  ansible.builtin.copy:
    content: "{{ client_ca_pem }}"
    dest: /var/lib/boetticher/identity/logging/ca.crt
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == logging_plan.collector

- name: Install the current client certificate revocation list for journal upload
  ansible.builtin.copy:
    content: "{{ client_crl_pem }}"
    dest: /var/lib/boetticher/identity/logging/client-ca.crl.pem
    owner: root
    group: root
    mode: '0644'
  no_log: true
  notify: reload nginx
  when: inventory_hostname == logging_plan.collector

- name: Install the journal-remote configuration contract
  ansible.builtin.copy:
    content: "{{ logging_collector_config }}"
    dest: /etc/systemd/journal-remote.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload logging systemd
  when: inventory_hostname == logging_plan.collector

- name: Install the journal-remote service override
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-journal-remote.service.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname == logging_plan.collector

- name: Install the journal-remote service override file
  ansible.builtin.copy:
    content: "{{ logging_collector_service_override }}"
    dest: /etc/systemd/system/systemd-journal-remote.service.d/boetticher.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload logging systemd
  when: inventory_hostname == logging_plan.collector

- name: Install the journal-remote socket override
  ansible.builtin.file:
    path: /etc/systemd/system/systemd-journal-remote.socket.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: inventory_hostname == logging_plan.collector

- name: Install the journal-remote socket override file
  ansible.builtin.copy:
    content: "{{ logging_collector_socket_override }}"
    dest: /etc/systemd/system/systemd-journal-remote.socket.d/boetticher.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload logging systemd
  when: inventory_hostname == logging_plan.collector

- name: Reload logging systemd units after collector override installation
  ansible.builtin.systemd:
    daemon_reload: true
  when: inventory_hostname == logging_plan.collector

- name: Disable the socket-activated collector listener
  ansible.builtin.service:
    name: systemd-journal-remote.socket
    enabled: false
    state: stopped
  when: inventory_hostname == logging_plan.collector

- name: Keep the collector stopped until its server certificate is installed
  ansible.builtin.service:
    name: systemd-journal-remote
    enabled: false
    state: stopped
  when:
    - inventory_hostname == logging_plan.collector
    - not logging_collector_certificate_ready.stat.exists

- name: Enable the collector after its server certificate is installed
  ansible.builtin.service:
    name: systemd-journal-remote
    enabled: true
    state: started
  when:
    - inventory_hostname == logging_plan.collector
    - logging_collector_certificate_ready.stat.exists

- name: Install the revocation-enforcing journal mTLS proxy
  ansible.builtin.copy:
    dest: /etc/nginx/sites-available/boetticher-journal.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      server {
          listen {{ logging_plan.collector_address }}:{{ logging_plan.collector_port }} ssl;
          server_name logs.{{ domain }};
          ssl_certificate /var/lib/boetticher/identity/logging/collector.crt;
          ssl_certificate_key /var/lib/boetticher/identity/logging/collector.key;
          ssl_client_certificate /var/lib/boetticher/identity/logging/ca.crt;
          ssl_crl /var/lib/boetticher/identity/logging/client-ca.crl.pem;
          ssl_verify_client on;
          ssl_protocols TLSv1.2 TLSv1.3;
          set $boetticher_logging_client_allowed 0;
      {% for endpoint in logging_upload_configs.keys() | sort %}
          if ($ssl_client_s_dn ~ "^CN=client-{{ endpoint | regex_escape }}\\.{{ domain | regex_escape }}(?:,O=boetticher)?$") { set $boetticher_logging_client_allowed 1; }
      {% endfor %}
          if ($boetticher_logging_client_allowed = 0) { return 403; }
          location = /upload {
              proxy_pass http://127.0.0.1:{{ logging_plan.collector_backend_port }};
              proxy_pass_request_headers on;
              proxy_set_header Host $host;
          }
          location / { return 404; }
      }
  no_log: true
  notify: reload nginx
  when:
    - inventory_hostname == logging_plan.collector
    - logging_collector_certificate_ready.stat.exists

- name: Enable the revocation-enforcing journal mTLS proxy
  ansible.builtin.file:
    src: /etc/nginx/sites-available/boetticher-journal.conf
    dest: /etc/nginx/sites-enabled/boetticher-journal.conf
    state: link
    force: true
  notify: reload nginx
  when:
    - inventory_hostname == logging_plan.collector
    - logging_collector_certificate_ready.stat.exists

- name: Enable the journal mTLS proxy after certificate installation
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started
  when:
    - inventory_hostname == logging_plan.collector
    - logging_collector_certificate_ready.stat.exists

- name: Reload nginx after enabling the journal mTLS proxy
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when:
    - inventory_hostname == logging_plan.collector
    - logging_collector_certificate_ready.stat.exists

- name: Keep the optional AIOps journal query stopped when AIOps is disabled
  ansible.builtin.service:
    name: boetticher-log-query
    enabled: false
    state: stopped
  when:
    - inventory_hostname == logging_plan.collector
    - not (module_configs.aiops is defined and module_configs.aiops.enabled | default(false) | bool)

- name: Clear stale failure state for the disabled AIOps journal query
  ansible.builtin.command:
    argv: [systemctl, reset-failed, boetticher-log-query]
  register: boetticher_log_query_reset
  changed_when: false
  failed_when: boetticher_log_query_reset.rc != 0 and 'Unit boetticher-log-query.service not loaded.' not in boetticher_log_query_reset.stderr
  when:
    - inventory_hostname == logging_plan.collector
    - not (module_configs.aiops is defined and module_configs.aiops.enabled | default(false) | bool)

- name: Install the bounded AIOps journal query policy
  ansible.builtin.file:
    path: /etc/boetticher-log-query
    state: directory
    owner: root
    group: boetticher-log-query
    mode: '0750'
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Create the journal-query endpoint identity directory
  ansible.builtin.file:
    path: /var/lib/boetticher/identity/tls
    state: directory
    owner: root
    group: boetticher-log-query
    mode: '0750'
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Issue and renew the journal-query certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: Journal query
    step_ca_endpoint_subject: "log-query.{{ domain }}"
    step_ca_endpoint_sans: ["log-query.{{ domain }}", "logs.{{ domain }}", "lab-log-01.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/log-query.crt
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/log-query.key
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/log-query.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-log-query-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-log-query-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-log-query-certificate.timer
    step_ca_endpoint_reload_service: boetticher-log-query
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run
    step_ca_endpoint_certificate_group: boetticher-log-query
    step_ca_endpoint_certificate_mode: '0640'
    step_ca_endpoint_key_group: boetticher-log-query
    step_ca_endpoint_key_mode: '0640'
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Check whether the journal-query certificate is ready
  ansible.builtin.stat:
    path: /var/lib/boetticher/identity/tls/log-query.crt
  register: log_query_server_certificate_ready
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Create the journal-query PKI trust directory
  ansible.builtin.file:
    path: /etc/boetticher/pki
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Install the journal-query certificate and client CA
  ansible.builtin.copy:
    dest: "{{ item.dest }}"
    content: "{{ item.content }}"
    owner: root
    group: "{{ item.group }}"
    mode: '0640'
  loop:
    - {dest: /etc/boetticher/pki/client-ca.crt, content: "{{ client_ca_pem | default('') }}", group: boetticher-log-query}
    - {dest: /etc/boetticher/pki/client-ca.crl.pem, content: "{{ client_crl_pem | default('') }}", group: boetticher-log-query}
  no_log: true
  notify: restart journal query
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool
    - step_ca_root_cert_pem | default('') | length > 0
    - client_ca_pem | default('') | length > 0

- name: Record journal-query identity readiness
  ansible.builtin.set_fact:
    log_query_identity_ready: "{{ log_query_server_certificate_ready.stat.exists | default(false) | bool and client_ca_pem | default('') | length > 0 }}"
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Render the bounded AIOps journal query policy
  ansible.builtin.copy:
    dest: /etc/boetticher-log-query/policy.json
    owner: root
    group: boetticher-log-query
    mode: '0640'
    content: "{{ {'hosts': {'lab-fw-01': ['kea-dhcp4.service', 'nftables.service'], 'lab-dns-01': ['blocky.service', 'pdns.service', 'chrony.service'], 'lab-monitor-01': ['pulse.service'], 'lab-log-01': ['systemd-journal-remote.service'], 'lab-bifrost-01': ['bifrost.service', 'nginx.service'], 'lab-aiops-01': ['boetticher-aiops.service', 'holmes.service']}} | to_nice_json }}"
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool

- name: Keep journal query disabled until its dedicated certificate is installed
  ansible.builtin.service:
    name: boetticher-log-query
    enabled: false
    state: stopped
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool
    - not (log_query_identity_ready | default(false) | bool)

- name: Enable journal query after its dedicated certificate is installed
  ansible.builtin.service:
    name: boetticher-log-query
    enabled: true
    state: started
  when:
    - inventory_hostname == logging_plan.collector
    - module_configs.aiops is defined
    - module_configs.aiops.enabled | default(false) | bool
    - log_query_identity_ready | default(false) | bool
