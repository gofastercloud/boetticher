- name: Require qualified Gatus artifact
  ansible.builtin.assert: {that: boetticher_appliance_artifact | default(false) | bool, fail_msg: "Gatus requires a qualified immutable appliance artifact"}
- name: Create Gatus configuration directory
  ansible.builtin.file: {path: /etc/boetticher/gatus, state: directory, owner: root, group: gatus, mode: '0750'}
- name: Install the Boetticher CA for Gatus endpoint HTTPS
  ansible.builtin.copy:
    content: "{{ step_ca_root_cert_pem }}"
    dest: /usr/local/share/ca-certificates/boetticher-gatus.crt
    owner: root
    group: root
    mode: '0644'
  notify: restart gatus
  when:
    - step_ca_root_cert_pem is defined
    - not (pki_bootstrap_phase | default(false) | bool)
- name: Refresh system CA trust for Gatus endpoint checks
  ansible.builtin.command: update-ca-certificates
  register: gatus_ca_update
  changed_when: "'0 added, 0 removed' not in gatus_ca_update.stdout"
  when:
    - step_ca_root_cert_pem is defined
    - not (pki_bootstrap_phase | default(false) | bool)
- name: Install generated Gatus configuration
  ansible.builtin.copy: {dest: /etc/boetticher/gatus/config.yaml, content: "{{ gatus_config }}", owner: root, group: gatus, mode: '0640'}
  notify: restart gatus
- name: Create Gatus identity TLS directory
  ansible.builtin.file: {path: /var/lib/boetticher/identity/tls, state: directory, owner: root, group: root, mode: '0750'}
- name: Issue and renew the Gatus endpoint certificate from Smallstep
  ansible.builtin.include_tasks: ../../tasks/step-ca-endpoint.yml
  vars:
    step_ca_endpoint_name: Gatus
    step_ca_endpoint_subject: "gatus.{{ domain }}"
    step_ca_endpoint_sans: ["gatus.{{ domain }}", "lab-gatus-01.{{ domain }}"]
    step_ca_endpoint_root_path: /var/lib/boetticher/identity/tls/step-ca-root.crt
    step_ca_endpoint_intermediate_path: /var/lib/boetticher/identity/tls/step-ca-intermediate.crt
    step_ca_endpoint_certificate_path: /var/lib/boetticher/identity/tls/gatus.crt.pem
    step_ca_endpoint_key_path: /var/lib/boetticher/identity/tls/gatus.key.pem
    step_ca_endpoint_marker_path: /var/lib/boetticher/identity/tls/gatus.step-ca
    step_ca_endpoint_renewal_script: /usr/local/sbin/boetticher-renew-gatus-certificate
    step_ca_endpoint_renewal_service: /etc/systemd/system/boetticher-renew-gatus-certificate.service
    step_ca_endpoint_renewal_timer: /etc/systemd/system/boetticher-renew-gatus-certificate.timer
    step_ca_endpoint_reload_service: nginx
    step_ca_endpoint_write_paths: /var/lib/boetticher/identity/tls /run
- name: Configure Gatus HTTPS frontend
  ansible.builtin.copy: {dest: /etc/nginx/sites-available/gatus.conf, content: "server { listen 10.10.20.100:443 ssl; server_name gatus.{{ domain }} lab-gatus-01.{{ domain }}; ssl_certificate /var/lib/boetticher/identity/tls/gatus.crt.pem; ssl_certificate_key /var/lib/boetticher/identity/tls/gatus.key.pem; location / { proxy_pass http://127.0.0.1:8080; } }"}
  when: step_ca_root_cert_pem is defined and not (pki_bootstrap_phase | default(false) | bool)
- name: Enable Gatus nginx site and services
  ansible.builtin.file: {src: /etc/nginx/sites-available/gatus.conf, dest: /etc/nginx/sites-enabled/gatus.conf, state: link}
  notify: reload nginx
  when: step_ca_root_cert_pem is defined and not (pki_bootstrap_phase | default(false) | bool)
- name: Enable Gatus and nginx
  ansible.builtin.service: {name: "{{ item }}", enabled: true, state: started}
  loop: [gatus, nginx]
  when: step_ca_root_cert_pem is defined and not (pki_bootstrap_phase | default(false) | bool)
