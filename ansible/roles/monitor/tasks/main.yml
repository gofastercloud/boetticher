---
- name: Require an immutable monitoring appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Monitoring runtime configuration requires a qualified boetticher appliance artifact"
  when: inventory_hostname == 'lab-monitor-01'

- name: Require the encrypted Pulse administrative credential at runtime
  ansible.builtin.assert:
    that:
      - credential_dropins[inventory_hostname]['pulse.service'] is defined
    fail_msg: "Pulse convergence requires the SOPS-provided administrative credential"
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'

- name: Require the Smallstep Pulse TLS and retained mTLS material
  ansible.builtin.assert:
    that:
      - step_ca_root_cert_pem is defined
      - step_ca_intermediate_cert_pem is defined
      - client_ca_pem is defined
      - client_crl_pem is defined
      - client_crl_pem | length > 0
    fail_msg: "Pulse TLS requires Smallstep root/intermediate and retained client-CA material"
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'

- name: Create the Pulse TLS directory before generating endpoint keys
  ansible.builtin.file:
    path: /etc/boetticher/tls
    state: directory
    owner: root
    group: root
    mode: '0750'
  when:
    - inventory_hostname == 'lab-monitor-01'

- name: Check whether Pulse already has a Smallstep-issued certificate
  ansible.builtin.stat:
    path: /etc/boetticher/tls/monitor.step-ca
  register: monitor_step_ca_marker
  when: inventory_hostname == 'lab-monitor-01'

- name: Install the Smallstep root trust on Pulse
  ansible.builtin.copy:
    content: "{{ step_ca_root_cert_pem }}"
    dest: /etc/boetticher/tls/step-ca-root.crt
    owner: root
    group: root
    mode: '0644'
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined

- name: Install the Smallstep intermediate chain on Pulse
  ansible.builtin.copy:
    content: "{{ step_ca_intermediate_cert_pem }}"
    dest: /etc/boetticher/tls/step-ca-intermediate.crt
    owner: root
    group: root
    mode: '0644'
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_intermediate_cert_pem is defined

- name: Create a one-time Pulse certificate token on the online CA
  ansible.builtin.command:
    argv:
      - /usr/local/bin/step
      - ca
      - token
      - monitor.{{ domain }}
      - --san
      - monitor.{{ domain }}
      - --san
      - lab-monitor-01.{{ domain }}
      - --provisioner
      - boetticher
      - --provisioner-password-file
      - /var/lib/boetticher/step-ca/secrets/password
      - --ca-url
      - https://lab-dns-01.{{ domain }}:9443
      - --root
      - /var/lib/boetticher/step-ca/certs/root_ca.crt
      - --cert-not-after
      - 720h
      - --not-after
      - 5m
  delegate_to: lab-dns-01
  register: monitor_step_ca_token_raw
  changed_when: false
  no_log: true
  environment:
    STEPPATH: /var/lib/boetticher/step-ca
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not monitor_step_ca_marker.stat.exists
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Keep only the Smallstep Pulse certificate token
  ansible.builtin.set_fact:
    monitor_step_ca_token_value: "{{ monitor_step_ca_token_raw.stdout_lines | last }}"
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not monitor_step_ca_marker.stat.exists
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Require a clean Smallstep Pulse certificate token
  ansible.builtin.assert:
    that:
      - monitor_step_ca_token_value is match('^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$')
    fail_msg: "Smallstep returned an invalid Pulse certificate token"
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not monitor_step_ca_marker.stat.exists
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Issue the Pulse certificate from Smallstep with an endpoint-owned key
  ansible.builtin.command:
    argv:
      - /usr/local/bin/step
      - ca
      - certificate
      - monitor.{{ domain }}
      - /etc/boetticher/tls/monitor.crt.pem.new
      - /etc/boetticher/tls/monitor.key.pem.new
      - --token
      - "{{ monitor_step_ca_token_value }}"
      - --ca-url
      - https://lab-dns-01.{{ domain }}:9443
      - --root
      - /etc/boetticher/tls/step-ca-root.crt
      - --force
  register: monitor_step_ca_issue
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not monitor_step_ca_marker.stat.exists
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Bundle the Pulse certificate chain
  ansible.builtin.command:
    argv:
      - /usr/local/bin/step
      - certificate
      - bundle
      - /etc/boetticher/tls/monitor.crt.pem.new
      - /etc/boetticher/tls/step-ca-intermediate.crt
      - /etc/boetticher/tls/monitor.crt.pem.bundle
      - --force
  register: monitor_step_ca_bundle
  changed_when: true
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not monitor_step_ca_marker.stat.exists
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Verify and activate the new Pulse certificate pair
  ansible.builtin.shell: >-
    set -eu;
    /usr/local/bin/step certificate verify
    /etc/boetticher/tls/monitor.crt.pem.bundle
    --roots /etc/boetticher/tls/step-ca-root.crt;
    test -s /etc/boetticher/tls/monitor.key.pem.new;
    chmod 0600 /etc/boetticher/tls/monitor.key.pem.new;
    mv -f /etc/boetticher/tls/monitor.crt.pem.bundle /etc/boetticher/tls/monitor.crt.pem;
    mv -f /etc/boetticher/tls/monitor.key.pem.new /etc/boetticher/tls/monitor.key.pem;
    install -o root -g root -m 0644 /dev/null /etc/boetticher/tls/monitor.step-ca
  args:
    executable: /bin/sh
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not monitor_step_ca_marker.stat.exists
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Install the Pulse certificate renewal helper
  ansible.builtin.template:
    src: renew-monitor-certificate.sh.j2
    dest: /usr/local/sbin/boetticher-renew-monitor-certificate
    owner: root
    group: root
    mode: '0750'
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined

- name: Install the Pulse certificate renewal service
  ansible.builtin.template:
    src: renew-monitor-certificate.service.j2
    dest: /etc/systemd/system/boetticher-renew-monitor-certificate.service
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined

- name: Install the Pulse certificate renewal timer
  ansible.builtin.template:
    src: renew-monitor-certificate.timer.j2
    dest: /etc/systemd/system/boetticher-renew-monitor-certificate.timer
    owner: root
    group: root
    mode: '0644'
  notify: reload systemd
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined

- name: Enable the Pulse certificate renewal timer
  ansible.builtin.systemd_service:
    name: boetticher-renew-monitor-certificate.timer
    enabled: true
    state: started
    daemon_reload: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined

- name: Install the client CA for Pulse mTLS
  ansible.builtin.copy:
    content: "{{ client_issuing_ca_pem }}"
    dest: /etc/boetticher/tls/client-ca.pem
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  no_log: true
  when: inventory_hostname == 'lab-monitor-01'

- name: Install the current client certificate revocation list for Pulse mTLS
  ansible.builtin.copy:
    content: "{{ client_crl_pem }}"
    dest: /etc/boetticher/tls/client-ca.crl.pem
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  no_log: true
  when: inventory_hostname == 'lab-monitor-01'

- name: Install the platform CA for exact AIOps webhook TLS verification
  ansible.builtin.copy:
    content: "{{ client_ca_pem }}"
    dest: /usr/local/share/ca-certificates/boetticher-platform.crt
    owner: root
    group: root
    mode: '0644'
  notify: update CA certificates
  no_log: true
  when: inventory_hostname == 'lab-monitor-01'

- name: Check the installed Pulse release
  ansible.builtin.command: /opt/pulse/bin/pulse --version
  register: pulse_version
  changed_when: false
  check_mode: false
  when: inventory_hostname == 'lab-monitor-01'

- name: Refuse an unsupported Pulse release
  ansible.builtin.assert:
    that: "'6.1.2' in pulse_version.stdout"
    fail_msg: "The installed Pulse server is not the qualified 6.1.2 release"
  when: inventory_hostname == 'lab-monitor-01'

- name: Create the persistent Pulse state directory
  ansible.builtin.file:
    path: /var/lib/pulse
    state: directory
    owner: pulse
    group: pulse
    mode: '0700'
  when: inventory_hostname == 'lab-monitor-01'

- name: Install the Proxmox CA for Pulse outbound TLS verification
  ansible.builtin.copy:
    content: "{{ proxmox_ca_pem }}"
    dest: /usr/local/share/ca-certificates/boetticher-proxmox.crt
    owner: root
    group: root
    mode: '0644'
  notify: update CA certificates
  when:
    - inventory_hostname == 'lab-monitor-01'
    - proxmox_ca_pem is defined
    - proxmox_ca_pem | length > 0

- name: Install the Pulse nginx proxy-auth renderer
  ansible.builtin.template:
    src: pulse-nginx-proxy-auth.sh.j2
    dest: /usr/local/sbin/boetticher-pulse-nginx-proxy-auth
    owner: root
    group: root
    mode: '0750'
  register: pulse_proxy_auth_renderer
  when: inventory_hostname == 'lab-monitor-01'

- name: Configure nginx to materialize the Pulse proxy-auth header
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/boetticher-pulse-proxy-auth.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Service]
      ExecStartPre=
      ExecStartPre=/usr/local/sbin/boetticher-pulse-nginx-proxy-auth
      ExecStartPre=/usr/sbin/nginx -t -q -g 'daemon on; master_process on;'
  register: pulse_proxy_auth_dropin
  when: inventory_hostname == 'lab-monitor-01'

- name: Restart nginx after changing the Pulse proxy-auth renderer
  ansible.builtin.systemd_service:
    name: nginx
    state: restarted
    daemon_reload: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - pulse_proxy_auth_renderer is changed or pulse_proxy_auth_dropin is changed

- name: Configure the Pulse frontend with server TLS and client certificate authentication
  ansible.builtin.template:
    src: pulse-loopback.conf.j2
    dest: /etc/nginx/sites-available/pulse.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Enable the mTLS-protected Pulse frontend
  ansible.builtin.file:
    src: /etc/nginx/sites-available/pulse.conf
    dest: /etc/nginx/sites-enabled/pulse.conf
    state: link
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Remove the distribution nginx default site on the monitor
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Reload nginx after enabling the monitoring frontend
  ansible.builtin.service:
    name: nginx
    state: reloaded
  when:
    - inventory_hostname == 'lab-monitor-01'
    - step_ca_root_cert_pem is defined
    - not (pki_bootstrap_phase | default(false) | bool)

- name: Enable monitoring services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - pulse
    - nginx
  when: inventory_hostname == 'lab-monitor-01'

- name: Inspect Pulse service state after runtime configuration
  ansible.builtin.command: systemctl show pulse --property=ActiveState --property=SubState --value
  register: pulse_service_state
  changed_when: false
  when: inventory_hostname == 'lab-monitor-01'

- name: Inspect Pulse runtime credential materialization
  ansible.builtin.command: test -s /run/credentials/pulse.service/pulse-admin-password
  register: pulse_runtime_credential
  changed_when: false
  failed_when: false
  when: inventory_hostname == 'lab-monitor-01'

- name: Restart Pulse after credential projection or an unhealthy start
  ansible.builtin.systemd_service:
    name: pulse
    state: restarted
    daemon_reload: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - >-
      (boetticher_credential_dropin_install is changed) or
      (pulse_service_state.stdout_lines | default([]) != ['active', 'running']) or
      (pulse_runtime_credential.rc | default(1) != 0)
