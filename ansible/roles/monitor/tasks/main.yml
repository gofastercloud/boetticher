---
- name: Require an immutable monitoring appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "Monitoring runtime configuration requires a qualified boetticher appliance artifact"
  when: inventory_hostname == 'lab-monitor-01'

- name: Require the encrypted Zabbix database password at runtime
  ansible.builtin.assert:
    that:
      - credential_dropins[inventory_hostname]['zabbix-server.service'] is defined
    fail_msg: "Zabbix convergence requires the SOPS-provided database password"
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'

- name: Require the controller-issued Zabbix mTLS material
  ansible.builtin.assert:
    that:
      - client_ca_pem is defined
      - (pki_bootstrap_phase | default(false) | bool) or (monitor_server_cert_pem is defined and monitor_server_cert_pem | length > 0)
    fail_msg: "Zabbix mTLS requires controller-issued server and client-CA material"
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'

- name: Create the Zabbix TLS directory before generating endpoint keys
  ansible.builtin.file:
    path: /etc/boetticher/tls
    state: directory
    owner: root
    group: root
    mode: '0750'
  when:
    - inventory_hostname == 'lab-monitor-01'

- name: Generate the monitor endpoint private key locally
  ansible.builtin.command:
    argv:
      - openssl
      - genpkey
      - -algorithm
      - EC
      - -pkeyopt
      - ec_paramgen_curve:P-256
      - -out
      - /etc/boetticher/tls/monitor.key.pem
  args:
    creates: /etc/boetticher/tls/monitor.key.pem
  when: inventory_hostname == 'lab-monitor-01'

- name: Restrict the monitor endpoint private key
  ansible.builtin.file:
    path: /etc/boetticher/tls/monitor.key.pem
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname == 'lab-monitor-01'

- name: Generate the monitor endpoint CSR locally
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -new
      - -sha256
      - -key
      - /etc/boetticher/tls/monitor.key.pem
      - -subj
      - /CN=monitor.lab.home.arpa
      - -addext
      - subjectAltName=DNS:monitor.lab.home.arpa,DNS:lab-monitor-01.lab.home.arpa
      - -out
      - /etc/boetticher/tls/monitor.csr.pem
  args:
    creates: /etc/boetticher/tls/monitor.csr.pem
  when: inventory_hostname == 'lab-monitor-01'

- name: Fetch the endpoint-generated monitor CSR to the controller runtime directory
  ansible.builtin.fetch:
    src: /etc/boetticher/tls/monitor.csr.pem
    dest: "{{ pki_csr_output_dir }}/monitor.csr.pem"
    flat: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - pki_bootstrap_phase | default(false) | bool

- name: Install Zabbix server certificate
  ansible.builtin.copy:
    content: "{{ monitor_server_cert_pem }}"
    dest: /etc/boetticher/tls/monitor.crt.pem
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  no_log: true
  when:
    - inventory_hostname == 'lab-monitor-01'
    - monitor_server_cert_pem is defined
    - monitor_server_cert_pem | length > 0

- name: Install the client CA for Zabbix mTLS
  ansible.builtin.copy:
    content: "{{ client_ca_pem }}"
    dest: /etc/boetticher/tls/client-ca.pem
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  no_log: true
  when: inventory_hostname == 'lab-monitor-01'

- name: Check the installed Zabbix server series
  ansible.builtin.command: zabbix_server --version
  register: zabbix_server_version
  changed_when: false
  check_mode: false
  when: inventory_hostname == 'lab-monitor-01'

- name: Refuse an unsupported Zabbix server series
  ansible.builtin.assert:
    that: "'7.0.' in zabbix_server_version.stdout"
    fail_msg: "The installed Zabbix server is not in the qualified 7.0 LTS series"
  when: inventory_hostname == 'lab-monitor-01'

- name: Create the dedicated Zabbix database role and database
  ansible.builtin.command: runuser -u postgres -- psql --dbname postgres --set ON_ERROR_STOP=1
  args:
    stdin: |
      DO $do$
      BEGIN
        IF NOT EXISTS (SELECT FROM pg_catalog.pg_roles WHERE rolname = 'zabbix') THEN
          CREATE ROLE zabbix LOGIN;
        ELSE
          ALTER ROLE zabbix LOGIN;
        END IF;
      END
      $do$;
      SELECT 'CREATE DATABASE zabbix OWNER zabbix'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'zabbix')\gexec
  changed_when: false
  no_log: true
  when: inventory_hostname == 'lab-monitor-01'

- name: Check whether the Zabbix schema marker exists
  ansible.builtin.stat:
    path: /var/lib/zabbix/.boetticher-schema-loaded
  register: zabbix_schema_marker
  when: inventory_hostname == 'lab-monitor-01'

- name: Load the packaged Zabbix PostgreSQL schema
  ansible.builtin.shell: >-
    runuser -u zabbix -- sh -c
    'zcat /usr/share/zabbix-sql-scripts/postgresql/server.sql.gz
    | psql --dbname zabbix --username zabbix'
  args:
    creates: /var/lib/zabbix/.boetticher-schema-loaded
  when:
    - inventory_hostname == 'lab-monitor-01'
    - not zabbix_schema_marker.stat.exists

- name: Record the loaded Zabbix schema
  ansible.builtin.file:
    path: /var/lib/zabbix/.boetticher-schema-loaded
    state: touch
    owner: zabbix
    group: zabbix
    mode: '0600'
  when: inventory_hostname == 'lab-monitor-01'

- name: Configure Zabbix server
  ansible.builtin.template:
    src: zabbix_server.conf.j2
    dest: /etc/zabbix/zabbix_server.conf.template
    owner: root
    group: zabbix
    mode: '0640'
  notify: restart zabbix-server
  no_log: true
  when: inventory_hostname == 'lab-monitor-01'

- name: Configure Zabbix Agent 2 on the monitoring host
  ansible.builtin.template:
    src: zabbix_agent2.conf.j2
    dest: /etc/zabbix/zabbix_agent2.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart zabbix-agent2
  when: inventory_hostname == 'lab-monitor-01'

- name: Configure the Zabbix frontend with server TLS and client certificate authentication
  ansible.builtin.template:
    src: zabbix-loopback.conf.j2
    dest: /etc/nginx/sites-available/zabbix.conf
    owner: root
    group: root
    mode: '0644'
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - monitor_server_cert_pem is defined
    - monitor_server_cert_pem | length > 0

- name: Enable the mTLS-protected Zabbix frontend
  ansible.builtin.file:
    src: /etc/nginx/sites-available/zabbix.conf
    dest: /etc/nginx/sites-enabled/zabbix.conf
    state: link
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - monitor_server_cert_pem is defined
    - monitor_server_cert_pem | length > 0

- name: Remove the distribution nginx default site on the monitor
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx
  when:
    - inventory_hostname == 'lab-monitor-01'
    - monitor_server_cert_pem is defined
    - monitor_server_cert_pem | length > 0

- name: Publish boetticher-owned Zabbix source definitions
  ansible.builtin.copy:
    src: zabbix-platform/
    dest: /etc/zabbix/boetticher-platform/
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == 'lab-monitor-01'

- name: Publish the deterministic boetticher Zabbix desired-object manifest
  ansible.builtin.template:
    src: zabbix-platform.json.j2
    dest: /etc/zabbix/boetticher-platform/desired-objects.json
    owner: root
    group: root
    mode: '0644'
  when: inventory_hostname == 'lab-monitor-01'

- name: Enable monitoring services
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - postgresql
    - zabbix-server
    - zabbix-agent2
    - nginx
  when: inventory_hostname == 'lab-monitor-01'
