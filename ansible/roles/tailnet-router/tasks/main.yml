---
- name: Require an immutable tailnet-router appliance artifact
  ansible.builtin.assert:
    that: boetticher_appliance_artifact | default(false) | bool
    fail_msg: "tailnet-router requires a qualified immutable appliance artifact"

- name: Require the pinned Tailscale runtime
  ansible.builtin.command: tailscale version
  register: tailscale_version
  changed_when: false

- name: Refuse an unqualified Tailscale runtime
  ansible.builtin.assert:
    that: "'1.76.6' in tailscale_version.stdout"
    fail_msg: "tailnet-router requires the pinned Tailscale 1.76.6 runtime"

- name: Keep retained Tailscale identity state private
  ansible.builtin.file:
    path: /var/lib/tailscale
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Persist disabled forwarding until Tailnet policy loads
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-boetticher-tailnet-router.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.ipv4.ip_forward=0
      net.ipv6.conf.all.forwarding=0
      net.ipv6.conf.default.forwarding=0

- name: Validate exact reviewed Tailnet IPv4 client addresses
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import ipaddress,json,sys
        values=json.load(sys.stdin)
        network=ipaddress.ip_network('100.64.0.0/10')
        assert isinstance(values,list) and len(values)==len(set(values))
        assert all(isinstance(v,str) and str(ipaddress.IPv4Address(v))==v and ipaddress.IPv4Address(v) in network for v in values)
    stdin: '{{ tailnet_trusted_clients | default([]) | to_json }}'
  changed_when: false

- name: Render the Tailnet client forwarding boundary
  ansible.builtin.template:
    src: forwarding.nft.j2
    dest: /etc/nftables.d/tailnet.nft
    owner: root
    group: root
    mode: '0600'
    validate: '/usr/sbin/nft -c -f %s'
  register: tailnet_policy_install
  notify: reload Tailnet firewall policy

- name: Disable Tailnet forwarding before a changed policy is activated
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=0]
  changed_when: false
  when: tailnet_policy_install.changed

- name: Load the persistent Tailnet boundary before enabling forwarding
  ansible.builtin.systemd_service:
    name: boetticher-tailnet-firewall
    enabled: true
    state: started
    daemon_reload: true

- name: Install the idempotent Tailscale registration helper
  ansible.builtin.copy:
    dest: /usr/lib/boetticher/tailscale-router-bootstrap
    owner: root
    group: root
    mode: '0750'
    content: |
      #!/bin/sh
      set -eu
      enable_forwarding() {
          sysctl -w net.ipv4.ip_forward=1 >/dev/null
      }
      if tailscale status --json 2>/dev/null | grep -Eq '"BackendState"[[:space:]]*:[[:space:]]*"Running"'; then
          tailscale set --accept-dns=false --accept-routes=false --advertise-routes=10.10.0.0/16 --snat-subnet-routes=true --advertise-exit-node=false --exit-node=
          enable_forwarding
          exit 0
      fi
      credential="${CREDENTIALS_DIRECTORY:-}/tailscale-auth-key"
      if [ -s "$credential" ] && tailscale up --timeout=30s --auth-key="file:$credential" --accept-dns=false --advertise-routes=10.10.0.0/16 --snat-subnet-routes=true >/dev/null 2>&1; then
          enable_forwarding
          exit 0
      fi
      if [ -s /var/lib/tailscale/tailscaled.state ] && tailscale up --timeout=30s --accept-dns=false --advertise-routes=10.10.0.0/16 --snat-subnet-routes=true >/dev/null 2>&1; then
          enable_forwarding
          exit 0
      fi
      test -s "$credential"
      tailscale up --timeout=30s --auth-key="file:$credential" --accept-dns=false --advertise-routes=10.10.0.0/16 --snat-subnet-routes=true >/dev/null 2>&1
      enable_forwarding
  notify: restart tailscaled after Tailnet hook change

- name: Add the bounded TUN credential and bootstrap hook to tailscaled
  ansible.builtin.copy:
    dest: /etc/systemd/system/tailscaled.service.d/boetticher.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Requires=boetticher-tailnet-firewall.service
      BindsTo=boetticher-tailnet-firewall.service
      After=boetticher-tailnet-firewall.service
      After=network-online.target
      Wants=network-online.target

      [Service]
      ExecStartPost=/usr/lib/boetticher/tailscale-router-bootstrap
  notify:
    - reload systemd
    - restart tailscaled after Tailnet hook change

- name: Enable and start tailscaled with retained state
  ansible.builtin.systemd_service:
    name: tailscaled
    enabled: true
    state: started
    daemon_reload: true

- name: Apply changed Tailnet policy and hooks before readiness
  ansible.builtin.meta: flush_handlers

- name: Inspect Tailscale backend state after credential projection
  ansible.builtin.command: tailscale status --json
  register: tailscale_backend_state
  changed_when: false
  failed_when: false

- name: Restart tailscaled to run registration helper when needed
  ansible.builtin.systemd_service:
    name: tailscaled
    state: restarted
    daemon_reload: true
  when:
    - tailscale_backend_state.rc != 0 or (tailscale_backend_state.stdout | regex_search('"BackendState"\s*:\s*"Running"')) is none

- name: Require a registered Tailscale backend
  ansible.builtin.command: tailscale status --json
  register: tailscale_registered_state
  changed_when: false
  retries: 15
  delay: 2
  until: >-
    tailscale_registered_state.rc == 0 and
    (tailscale_registered_state.stdout | regex_search('"BackendState"\s*:\s*"Running"')) is not none
  failed_when: >-
    tailscale_registered_state.rc != 0 or
    (tailscale_registered_state.stdout | regex_search('"BackendState"\s*:\s*"Running"')) is none
- name: Reconcile retained Tailscale settings on every deployment
  ansible.builtin.command:
    argv: [tailscale, set, '--accept-dns=false', '--accept-routes=false', '--advertise-routes=10.10.0.0/16', '--snat-subnet-routes=true', '--advertise-exit-node=false', '--exit-node=']
  changed_when: false

- name: Enable IPv4 forwarding with the loaded client boundary
  ansible.builtin.command:
    argv: [sysctl, -w, net.ipv4.ip_forward=1]
  changed_when: false

- name: Configure module-local Pulse VPN sensors
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/vpn-sensors.yml"
  vars:
    vpn_health_module: tailnet-router
