---
- name: reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: restart pulse-agent
  ansible.builtin.systemd_service:
    name: pulse-agent
    state: restarted
    daemon_reload: true
  when: kiosk_pulse_agent_enabled | bool

- name: restart seatd
  ansible.builtin.systemd_service:
    name: seatd
    state: restarted
    daemon_reload: true

- name: restart companion streamdeck
  listen: restart boetticher-streamdeck
  ansible.builtin.systemd_service:
    name: boetticher-streamdeck
    state: restarted
    daemon_reload: true

- name: restart log2ram
  ansible.builtin.systemd_service:
    name: log2ram
    state: restarted

- name: restart ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: restart boetticher-companion
  ansible.builtin.systemd_service:
    name: boetticher-companion
    state: restarted
    daemon_reload: true

- name: restart boetticher-blinkt
  ansible.builtin.systemd_service:
    name: boetticher-blinkt
    state: restarted
    daemon_reload: true

- name: restart pulse-kiosk
  ansible.builtin.systemd_service:
    name: pulse-kiosk
    state: restarted
    daemon_reload: true

- name: reload companion ssh
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

- name: apply companion forwarding policy
  ansible.builtin.command: sysctl -p /etc/sysctl.d/70-boetticher-companion.conf
