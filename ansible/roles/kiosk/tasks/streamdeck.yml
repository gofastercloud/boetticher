---
- name: Require the supported USB identity and signed binary
  ansible.builtin.assert:
    that:
      - streamdeck_binary | length > 0
      - streamdeck_vendor_id | int == 4057
      - streamdeck_product_id | int == 109
      - streamdeck_serial | default('') is match('^[A-Za-z0-9_.-]*$')

- name: Create the StreamDeck group
  ansible.builtin.group:
    name: streamdeck
    system: true

- name: Create the unprivileged StreamDeck account
  ansible.builtin.user:
    name: streamdeck
    group: streamdeck
    groups: companion
    append: true
    home: /var/lib/boetticher/streamdeck
    create_home: true
    system: true
    shell: /usr/sbin/nologin
    password_lock: true

- name: Install the signed ARM64 StreamDeck executable
  ansible.builtin.copy:
    src: "{{ streamdeck_binary }}"
    dest: /usr/local/libexec/boetticher-streamdeck
    owner: root
    group: root
    mode: '0755'
  notify: restart boetticher-streamdeck

- name: Configure the selected USB display
  ansible.builtin.copy:
    dest: /etc/boetticher/streamdeck.json
    owner: root
    group: streamdeck
    mode: '0640'
    content: "{{ {'pulse_url': kiosk_pulse_url, 'vendor_id': streamdeck_vendor_id | int, 'product_id': streamdeck_product_id | int, 'model': streamdeck_model, 'serial': streamdeck_serial | default(''), 'ca_certificate': '/etc/boetticher/companion-ca.pem'} | to_nice_json }}\n"
  notify: restart boetticher-streamdeck

- name: Grant access to only the supported StreamDeck USB identity
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/70-boetticher-streamdeck.rules
    owner: root
    group: root
    mode: '0644'
    content: |
      SUBSYSTEM=="usb", ATTR{idVendor}=="0fd9", ATTR{idProduct}=="006d"{% if streamdeck_serial | length > 0 %}, ATTR{serial}=="{{ streamdeck_serial }}"{% endif %}, GROUP="streamdeck", MODE="0660"
      KERNEL=="hidraw*", ATTRS{idVendor}=="0fd9", ATTRS{idProduct}=="006d"{% if streamdeck_serial | length > 0 %}, ATTRS{serial}=="{{ streamdeck_serial }}"{% endif %}, GROUP="streamdeck", MODE="0660"
  register: companion_streamdeck_rule
  notify: restart boetticher-streamdeck

- name: Reload USB permissions
  ansible.builtin.command: udevadm control --reload-rules
  changed_when: false
  when: companion_streamdeck_rule is changed

- name: Reapply permissions to connected USB and hidraw devices
  ansible.builtin.command: "udevadm trigger --action=change --subsystem-match={{ item }}"
  loop: [usb, hidraw]
  changed_when: false
  when: companion_streamdeck_rule is changed

- name: Install the interactive StreamDeck service
  ansible.builtin.template:
    src: boetticher-streamdeck.service.j2
    dest: /etc/systemd/system/boetticher-streamdeck.service
    owner: root
    group: root
    mode: '0644'
  notify: restart boetticher-streamdeck

- name: Start the interactive StreamDeck
  ansible.builtin.systemd_service:
    name: boetticher-streamdeck.service
    enabled: true
    state: started
    daemon_reload: true
