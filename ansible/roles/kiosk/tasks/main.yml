---
- name: Require the supported Companion operating system and inputs
  ansible.builtin.assert:
    that:
      - ansible_system == 'Linux'
      - ansible_architecture in ['aarch64', 'arm64']
      - ansible_distribution in ['Debian', 'Raspbian']
      - ansible_distribution_major_version == '13'
      - ansible_service_mgr == 'systemd'
      - ansible_python.executable == '/usr/bin/python3'
      - companion_config is defined
      - companion_binary | default('') | length > 0
    fail_msg: "Companion requires Debian 13 ARM64, systemd, and the signed status executable"
  no_log: true

- name: Configure the Companion baseline
  ansible.builtin.include_tasks: baseline.yml

- name: Remove the retired standalone Blinkt service
  ansible.builtin.include_tasks: retired-blinkt.yml

- name: Configure the shared local status service
  ansible.builtin.include_tasks: status.yml

- name: Configure the Cage display
  ansible.builtin.include_tasks: display.yml
  when: kiosk_display_enabled | bool

- name: Configure the StreamDeck
  ansible.builtin.include_tasks: streamdeck.yml
  when: kiosk_streamdeck_enabled | bool

- name: Stop only installed disabled capability services
  ansible.builtin.include_tasks: disabled.yml
  loop:
    - {unit: boetticher-kiosk.service, enabled: "{{ kiosk_display_enabled | bool }}"}
    - {unit: boetticher-streamdeck.service, enabled: "{{ kiosk_streamdeck_enabled | bool }}"}
  loop_control:
    loop_var: capability

- name: Apply pending service changes before checking functionality
  ansible.builtin.meta: flush_handlers

- name: Check enabled Companion functions after startup
  ansible.builtin.command: /usr/local/libexec/boetticher-companion status
  register: companion_status
  changed_when: false
  retries: 24
  delay: 5
  until: companion_status.rc == 0

- name: Require the expected configured capability set
  ansible.builtin.assert:
    that:
      - (companion_status.stdout | from_json).display == (kiosk_display_enabled | bool)
      - (companion_status.stdout | from_json).streamdeck == (kiosk_streamdeck_enabled | bool)

- name: Remove superseded browser identity and telemetry assets after acceptance
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /home/kiosk/.pki/nssdb
    - /home/kiosk/legacy-dashboard-extension
    - /home/kiosk/visualizer
    - /etc/systemd/system/legacy-kiosk-stats.timer
    - /etc/systemd/system/legacy-kiosk-stats.service
    - /usr/local/libexec/legacy-kiosk-stats
    - /etc/chromium/policies/managed/boetticher-kiosk.json
    - /var/lib/boetticher/companion-streamdeck/client.key.pem
    - /var/lib/boetticher/companion-streamdeck/client.crt.pem
