---
- name: Inspect the installed encrypted credential
  ansible.builtin.stat:
    path: "/var/lib/boetticher/credentials/{{ credential_file }}.cred"
  register: installed_credential
  no_log: true
- name: Read the applied credential revision
  ansible.builtin.slurp:
    src: "/var/lib/boetticher/credentials/{{ credential_file }}.sha256"
  register: credential_revision
  failed_when: false
  no_log: true

- name: Install a changed encrypted systemd credential
  when: not installed_credential.stat.exists or (credential_revision.content | default('') | b64decode | trim) != (credential_value | hash('sha256'))
  block:
    - name: Create a private credential staging directory in RAM
      ansible.builtin.tempfile:
        state: directory
        path: /run
        prefix: boetticher-credential-
      register: credential_stage
    - name: Stage credential in RAM
      ansible.builtin.copy:
        dest: "{{ credential_stage.path }}/input"
        content: "{{ credential_value }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true
    - name: Encrypt the credential
      ansible.builtin.command:
        argv: [systemd-creds, encrypt, "--name={{ credential_name }}", "{{ credential_stage.path }}/input", "{{ credential_stage.path }}/encrypted"]
      no_log: true
    - name: Install the encrypted credential atomically
      ansible.builtin.copy:
        remote_src: true
        src: "{{ credential_stage.path }}/encrypted"
        dest: "/var/lib/boetticher/credentials/{{ credential_file }}.cred"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      notify: "restart {{ credential_service }}"
    - name: Record the installed credential revision
      ansible.builtin.copy:
        dest: "/var/lib/boetticher/credentials/{{ credential_file }}.sha256"
        content: "{{ credential_value | hash('sha256') }}\n"
        owner: root
        group: root
        mode: '0600'
      no_log: true
  always:
    - name: Remove private credential staging
      ansible.builtin.file:
        path: "{{ credential_stage.path }}"
        state: absent
      when: credential_stage.path is defined
