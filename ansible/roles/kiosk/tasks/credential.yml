---
- name: Inspect the separately streamed encrypted credential
  ansible.builtin.stat:
    path: "/var/lib/boetticher/credentials/{{ credential_file }}.cred"
  register: installed_credential

- name: Require the separately streamed encrypted credential
  ansible.builtin.assert:
    that:
      - installed_credential.stat.exists
      - installed_credential.stat.isreg
      - installed_credential.stat.pw_name == 'root'
      - installed_credential.stat.gr_name == 'root'
      - installed_credential.stat.mode == '0600'
    fail_msg: "Companion credential was not securely installed before Ansible provisioning"
