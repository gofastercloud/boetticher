api_version: labinabox/v1
platform_version: 0.1.0
schema_version: 1
storage_profile: single-disk
bootstrap_address: ""
ssh_identity_file: ""
physical_trunk: ""
tested_versions:
  opnsense: 26.7.0
  zabbix: "7.0 LTS"
network:
  domain: lab.home.arpa
  zones:
    - name: TRUSTED
      vlan: 10
      network: 10.10.10.0/24
      gateway: 10.10.10.1
      address_mode: dynamic-reservations
      dns_addresses: [10.10.20.10, 10.10.20.11]
      ntp_addresses: [10.10.20.10, 10.10.20.11]
    - name: SERVERS
      vlan: 20
      network: 10.10.20.0/24
      gateway: 10.10.20.1
      address_mode: dynamic-reservations
      dns_addresses: [10.10.20.10, 10.10.20.11]
      ntp_addresses: [10.10.20.10, 10.10.20.11]
    - name: SANDBOX
      vlan: 50
      network: 10.10.50.0/24
      gateway: 10.10.50.1
      address_mode: dynamic
      dns_addresses: [10.10.50.1]
      ntp_addresses: [10.10.50.1]
    - name: MGMT
      vlan: 99
      network: 10.10.99.0/24
      gateway: 10.10.99.1
      address_mode: reservations-only
      dns_addresses: [10.10.20.10, 10.10.20.11]
      ntp_addresses: [10.10.20.10, 10.10.20.11]
secret_metadata:
  installation_id: generated-by-homelab-init
  age_recipient: generated-by-homelab-init
pki:
  root_common_name: Homelab Root CA
  root_fingerprint: generated-by-homelab-init
  root_expiry: generated-by-homelab-init
  issuing_common_name: Homelab Issuing CA
  issuing_fingerprint: generated-by-homelab-init
  issuing_expiry: generated-by-homelab-init
modules:
  - name: lab-proxmox-01
    hostname: lab-proxmox-01
    zone: MGMT
    address: 10.10.99.5
    role: Proxmox host
    ssh_user: labadmin
    ssh_port: 22
    monitoring: true
    backup: true
    ssh_managed: true
    jump_allowed: false
    product_owned: true
  - name: lab-fw-01
    hostname: lab-fw-01
    zone: MGMT
    address: 10.10.99.1
    role: OPNsense firewall
    url: https://opnsense.lab.home.arpa
    monitoring: true
    backup: true
    ssh_managed: false
    jump_allowed: false
    product_owned: true
  - name: lab-dns-01
    hostname: lab-dns-01
    zone: SERVERS
    address: 10.10.20.10
    role: DNS/NTP
    dns_aliases: [dns01, dns]
    ssh_user: labadmin
    ssh_port: 22
    monitoring: true
    backup: true
    ssh_managed: true
    jump_allowed: true
    product_owned: true
  - name: lab-dns-02
    hostname: lab-dns-02
    zone: SERVERS
    address: 10.10.20.11
    role: DNS/NTP
    dns_aliases: [dns02]
    ssh_user: labadmin
    ssh_port: 22
    monitoring: true
    backup: true
    ssh_managed: true
    jump_allowed: true
    product_owned: true
  - name: lab-monitor-01
    hostname: lab-monitor-01
    zone: MGMT
    address: 10.10.99.20
    role: Zabbix
    url: https://monitor.lab.home.arpa
    dns_aliases: [monitor]
    ssh_user: labadmin
    ssh_port: 22
    monitoring: true
    backup: true
    mtls: true
    ssh_managed: true
    jump_allowed: true
    product_owned: true
  - name: lab-portal-01
    hostname: lab-portal-01
    zone: SERVERS
    address: 10.10.20.30
    role: Generated platform portal
    url: https://portal.lab.home.arpa
    dns_aliases: [portal]
    ssh_user: labadmin
    ssh_port: 22
    monitoring: true
    backup: true
    mtls: true
    ssh_managed: true
    jump_allowed: true
    product_owned: true
