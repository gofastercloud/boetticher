<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#12382a">
    <title>{{ page.title | escape }} · {{ site.title }}</title>
    <link rel="stylesheet" href="assets/site.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to the good stuff</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="index.html" aria-label="Boetticher home">
          <span class="brand-mark" aria-hidden="true">Bh</span>
          <span>Boetticher</span>
        </a>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html"{% if page.section == "home" %} aria-current="page"{% endif %}>Home</a>
          <a href="start.html"{% if page.section == "start" %} aria-current="page"{% endif %}>Start here</a>
          <a href="lab.html"{% if page.section == "lab" %} aria-current="page"{% endif %}>The lab</a>
          <a href="modules.html"{% if page.section == "modules" %} aria-current="page"{% endif %}>Modules</a>
          <a href="commands.html"{% if page.section == "commands" %} aria-current="page"{% endif %}>Commands</a>
          <a class="github-link" href="https://github.com/gofastercloud/boetticher">GitHub ↗</a>
        </nav>
      </div>
    </header>
    <main id="main" class="shell page-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <div class="shell footer-inner">
        <p><strong>Boetticher</strong> is a small open-source homelab project, made possible by a pile of excellent upstream projects.</p>
        <p><a href="https://github.com/gofastercloud/boetticher">Source</a> · <a href="https://github.com/gofastercloud/boetticher/blob/main/CONTRIBUTING.md">Contributing</a> · <a href="https://github.com/gofastercloud/boetticher/blob/main/SECURITY.md">Security</a> · <a href="https://github.com/gofastercloud/boetticher/blob/main/LICENSE">Apache-2.0</a></p>
      </div>
    </footer>
  </body>
</html>
