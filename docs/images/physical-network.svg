<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
 <title id="title">Boetticher reference lab physical wiring</title><desc id="desc">A physical wiring reference for the TP-Link switch, Eero, Companion controller, Proxmox Host, two laptops, and attached USB peripherals.</desc>
 <defs><style>text{font-family:Inter,Arial,sans-serif;fill:#172033}.h{font-size:27px;font-weight:700}.s{font-size:15px;fill:#475569}.l{font-size:16px;font-weight:700}.b{font-size:13px}.tiny{font-size:11px;fill:#475569}.card{stroke:#cbd5e1;stroke-width:1.5;rx:14}.panel{stroke:#94a3b8;stroke-width:1.5;rx:16}.eth{fill:none;stroke-width:5;stroke-linecap:round}.usb{fill:none;stroke:#64748b;stroke-width:3;stroke-dasharray:8 6;stroke-linecap:round}.port,.portlabel{fill:#fff!important}.port{font-size:13px;font-weight:700}.note{font-size:12px;fill:#475569}</style><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
 <rect width="1600" height="1040" fill="#f8fafc"/><text x="60" y="56" class="h">Boetticher reference lab — physical wiring</text><text x="60" y="81" class="s">Operator-specified reference wiring · 9 September 2026 · cable colours identify the intended network, not link health</text>
 <!-- HOME mesh --> <rect x="60" y="125" width="260" height="110" class="panel" fill="#eff6ff"/><text x="85" y="160" class="l">Primary Eero gateway</text><text x="85" y="185" class="b">HOME · 192.168.4.1</text><text x="85" y="207" class="note">Switch port 1 uplink</text>
 <rect x="60" y="295" width="260" height="130" class="panel" fill="#eff6ff"/><text x="85" y="330" class="l">Leaf Eero mesh unit</text><text x="85" y="355" class="b">HOME mesh</text><text x="85" y="378" class="note">Switch port 2</text><text x="85" y="400" class="note">No address assumed.</text>
 <!-- switch --> <rect x="570" y="110" width="460" height="670" class="panel" fill="#fff"/><text x="600" y="150" class="l">TP-Link TL-SG108PE</text><text x="600" y="173" class="s">8-port managed switch</text>
 <g><rect x="615" y="210" width="370" height="55" rx="10" fill="#111827"/><circle cx="645" cy="238" r="14" fill="#334155"/><text x="641" y="243" class="port">1</text><text x="675" y="243" class="b portlabel">Primary Eero gateway · HOME uplink</text>
 <rect x="615" y="280" width="370" height="55" rx="10" fill="#111827"/><circle cx="645" cy="308" r="14" fill="#334155"/><text x="641" y="313" class="port">2</text><text x="675" y="313" class="b portlabel">Leaf Eero mesh unit · HOME</text>
 <rect x="615" y="350" width="370" height="55" rx="10" fill="#111827"/><circle cx="645" cy="378" r="14" fill="#334155"/><text x="641" y="383" class="port">3</text><text x="675" y="383" class="b portlabel">Controller Pi · HOME</text>
 <rect x="615" y="420" width="370" height="55" rx="10" fill="#111827"/><circle cx="645" cy="448" r="14" fill="#334155"/><text x="641" y="453" class="port">4</text><text x="675" y="453" class="b portlabel">Proxmox Host · HOME</text>
 <rect x="615" y="490" width="370" height="55" rx="10" fill="#1e3a8a"/><circle cx="645" cy="518" r="14" fill="#2563eb"/><text x="641" y="523" class="port">5</text><text x="675" y="523" class="b portlabel">Proxmox Host · TRUNK (5 / 10 / 20 / 30 / 40 / 99)</text>
 <rect x="615" y="560" width="370" height="55" rx="10" fill="#713f12"/><circle cx="645" cy="588" r="14" fill="#eab308"/><text x="641" y="593" class="port">6</text><text x="675" y="593" class="b portlabel">Controller Pi · LAB / SERVERS</text>
 <rect x="615" y="630" width="370" height="55" rx="10" fill="#14532d"/><circle cx="645" cy="658" r="14" fill="#22c55e"/><text x="641" y="663" class="port">7</text><text x="675" y="663" class="b portlabel">Personal laptop · TRUSTED</text>
 <rect x="615" y="700" width="370" height="55" rx="10" fill="#7f1d1d"/><circle cx="645" cy="728" r="14" fill="#ef4444"/><text x="641" y="733" class="port">8</text><text x="675" y="733" class="b portlabel">Work laptop · SANDBOX</text></g>
 <!-- left equipment --> <rect x="60" y="485" width="390" height="220" class="panel" fill="#fefce8"/><text x="85" y="520" class="l">Controller · Raspberry Pi 4</text><text x="85" y="545" class="b">Argon Neo case · onboard eth0 (HOME)</text><text x="85" y="568" class="b">UGreen 2.5 Gb USB eth1 (LAB / SERVERS)</text><text x="85" y="602" class="b">Pimoroni Blinkt · 8 LEDs · GPIO</text><text x="85" y="625" class="b">StreamDeck V2 · 15 keys · USB</text><text x="85" y="658" class="note">Blinkt working; physical output recovered.</text>
 <rect x="60" y="760" width="390" height="165" class="panel" fill="#fff7ed"/><text x="85" y="795" class="l">Proxmox Host · Lenovo T580</text><text x="85" y="820" class="b">Built-in NIC (HOME) · UGreen 2.5 Gb USB NIC (TRUNK)</text><text x="85" y="846" class="b">Internal 256 GB NVMe: OS</text><text x="85" y="870" class="b">1 TB Timetec USB in Sabrent enclosure: datastore</text><text x="85" y="897" class="b">USB Ender 3 V3 SE printer</text>
 <!-- right laptops: aligned with access-port rows --> <rect x="1160" y="615" width="350" height="65" class="panel" fill="#f0fdf4"/><text x="1185" y="650" class="l">Personal laptop</text><text x="1185" y="676" class="b">TRUSTED · port 7</text>
 <rect x="1160" y="695" width="350" height="65" class="panel" fill="#fff1f2"/><text x="1185" y="730" class="l">Work laptop</text><text x="1185" y="756" class="b">SANDBOX · port 8</text>
 <!-- coloured ethernet --> <path d="M320 180H500V238H615" class="eth" stroke="#111827"/><path d="M320 360H470V308H615" class="eth" stroke="#111827"/><path d="M450 545H520V378H615" class="eth" stroke="#111827"/><path d="M450 808H540V448H615" class="eth" stroke="#111827"/><path d="M450 836H560V518H615" class="eth" stroke="#2563eb"/><path d="M450 568H580V588H615" class="eth" stroke="#eab308"/><path d="M985 658H1160" class="eth" stroke="#22c55e"/><path d="M985 728H1160" class="eth" stroke="#ef4444"/>
 <!-- USB --> <path d="M190 705V735" class="usb"/><text x="207" y="728" class="tiny">GPIO</text><path d="M300 705V735" class="usb"/><text x="317" y="728" class="tiny">USB</text><path d="M180 925V955" class="usb"/><text x="197" y="948" class="tiny">USB storage</text><path d="M350 925V955" class="usb"/><text x="367" y="948" class="tiny">USB printer</text>
 <!-- legend --> <rect x="570" y="830" width="940" height="95" class="panel" fill="#fff"/><text x="600" y="862" class="l">Cable key</text><path d="M720 857h55" class="eth" stroke="#111827"/><text x="787" y="862" class="b">HOME / black</text><path d="M920 857h55" class="eth" stroke="#2563eb"/><text x="987" y="862" class="b">VLAN trunk / blue</text><path d="M1130 857h55" class="eth" stroke="#eab308"/><text x="1197" y="862" class="b">SERVERS / yellow</text><path d="M1320 857h55" class="eth" stroke="#22c55e"/><text x="1387" y="862" class="b">TRUSTED / green</text><path d="M720 893h55" class="eth" stroke="#ef4444"/><text x="787" y="898" class="b">SANDBOX / red</text><path d="M920 893h55" class="usb"/><text x="987" y="898" class="b">USB / grey dashed</text><text x="1130" y="898" class="note">Reference wiring only; not a complete live-link audit.</text>
 <text x="60" y="990" class="tiny">Scope: physical cabling and attached hardware. Logical services, routes, firewall policy, observability and media rollout state are shown in the companion logical topology.</text>
</svg>
