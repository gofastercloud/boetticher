name: Release bundle

on:
  push:
    tags: ['v0.5.*']
  workflow_dispatch:
    inputs:
      release_version:
        description: Release version to build
        required: true
        default: 0.5.0

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, qualify, and publish the signed release bundle
    runs-on: ubuntu-24.04
    env:
      GOCACHE: ${{ github.workspace }}/.cache/go-build
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod
      BOETTICHER_ARTIFACT_OUTPUT: ${{ github.workspace }}/generated/artifacts
      RELEASE_VERSION: ${{ inputs.release_version || github.ref_name }}
      RELEASE_KEY_ID: ${{ secrets.BOETTICHER_RELEASE_KEY_ID }}
      RELEASE_TRUSTED_KEY_DATA: ${{ secrets.BOETTICHER_RELEASE_TRUSTED_KEYS }}
      RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.BOETTICHER_RELEASE_SIGNING_KEY }}

    steps:
      - name: Check out the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.12.6'

      - name: Install the source-gate dependencies
        run: python -m pip install --disable-pip-version-check ansible-core==2.19.1

      - name: Normalize and validate release identity
        shell: bash
        run: |
          set -euo pipefail
          input_release_version="${RELEASE_VERSION:-}"
          release_version="${input_release_version#v}"
          case "$release_version" in
            0.5.*) ;;
            *) echo "unsupported release version: $release_version" >&2; exit 1 ;;
          esac
          [ -n "${RELEASE_KEY_ID:-}" ] || { echo "release signing key id is not configured" >&2; exit 1; }
          [ -n "${RELEASE_TRUSTED_KEY_DATA:-}" ] || { echo "release trusted public key data is not configured" >&2; exit 1; }
          [ -n "${RELEASE_SIGNING_PRIVATE_KEY:-}" ] || { echo "release signing key is not configured" >&2; exit 1; }
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"

      - name: Install pinned Linux appliance build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            debian-archive-keyring curl jq libguestfs-tools mmdebstrap qemu-utils zstd

      - name: Run the complete source and contract gate
        run: make ci

      - name: Install the pinned Trivy release
        shell: bash
        env:
          TRIVY_VERSION: 0.69.3
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trivy.tar.gz"
          checksums="$RUNNER_TEMP/trivy-checksums.txt"
          curl --fail --location --silent --show-error --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl --fail --location --silent --show-error --output "$checksums" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_checksums.txt"
          expected="$(awk -v name="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" '$2 == name { print $1 }' "$checksums")"
          [ -n "$expected" ] || { echo "Trivy checksum entry is missing" >&2; exit 1; }
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status
          sudo tar --extract --file "$archive" --directory /usr/local/bin trivy
          trivy --version | grep -Fq "Version: ${TRIVY_VERSION}"

      - name: Build every checked-in appliance definition
        run: |
          sudo -E env \
            PATH="$PATH" \
            GOCACHE="$GOCACHE" \
            GOMODCACHE="$GOMODCACHE" \
            BOETTICHER_RELEASE_VERSION="$RELEASE_VERSION" \
            BOETTICHER_ARTIFACT_OUTPUT="$BOETTICHER_ARTIFACT_OUTPUT" \
            BOETTICHER_IMAGE_WORK="$RUNNER_TEMP/boetticher-image-build" \
            BOETTICHER_CACHE_ROOT="$RUNNER_TEMP/boetticher-cache" \
            ./scripts/build-images.sh images

      - name: Scan, smoke-qualify, and record evidence for every artifact
        run: |
          sudo -E env \
            PATH="$PATH" \
            GOCACHE="$GOCACHE" \
            GOMODCACHE="$GOMODCACHE" \
            BOETTICHER_ARTIFACT_OUTPUT="$BOETTICHER_ARTIFACT_OUTPUT" \
            BOETTICHER_SCAN_LOG_ROOT="$RUNNER_TEMP/boetticher-scan-logs" \
            ./scripts/scan-images.sh scan-images

      - name: Assemble the complete signed release bundle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          signing_key="$RUNNER_TEMP/boetticher-release-signing-key"
          trap 'rm -f "$signing_key"' EXIT
          printf '%s' "$RELEASE_SIGNING_PRIVATE_KEY" > "$signing_key"
          mkdir -p dist
          make release-bundle \
            OUTPUT="$RUNNER_TEMP/boetticher-${RELEASE_VERSION}.tar.gz" \
            RELEASE_VERSION="$RELEASE_VERSION" \
            SOURCE_COMMIT="$GITHUB_SHA" \
            WORKFLOW="$GITHUB_WORKFLOW_REF" \
            KEY_ID="$RELEASE_KEY_ID" \
            PRIVATE_KEY="$signing_key"
          cp "$RUNNER_TEMP/boetticher-${RELEASE_VERSION}.tar.gz" "dist/boetticher-${RELEASE_VERSION}.tar.gz"

      - name: Build the controller with the release trust root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X github.com/gofastercloud/boetticher/internal/artifacts.EmbeddedTrustedReleaseKeyData=${RELEASE_TRUSTED_KEY_DATA}" \
            -o "dist/boetticher-${RELEASE_VERSION}" ./cmd/boetticher

      - name: Publish the release only for a validated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/boetticher-${RELEASE_VERSION}" \
            "dist/boetticher-${RELEASE_VERSION}.tar.gz" \
            --verify-tag "$GITHUB_REF_NAME" \
            --generate-notes
