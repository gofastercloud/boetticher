name: boetticher-dns-adguard
version: 1.0.0
kind: lxc
base: boetticher-base
base_version: 0.3.29
common: ../image.yaml
provider: adguard
services:
  - powerdns-authoritative
  - adguard-home
  - chrony
runtime_config: /etc/boetticher/module.yaml
persistent:
  - /var/lib/powerdns
  - /var/lib/boetticher/identity/ssh
