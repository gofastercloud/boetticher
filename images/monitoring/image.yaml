name: boetticher-monitoring
version: 1.0.0
kind: lxc
base: boetticher-base
base_version: 0.3.33
architecture: amd64
services:
  - pulse
  - nginx
pulse:
  version: 6.1.2
  release_url: https://github.com/rcourtman/Pulse/releases/download/v6.1.2/pulse-v6.1.2-linux-amd64.tar.gz
  release_sha256: 844cd054bcfce528cbcf434d782e571791cc7b02ef2fe298cf138b1cab1087ea
logging: inherited-from-base
runtime_config: /etc/boetticher/module.yaml
persistent:
  - /var/lib/pulse
  - /var/lib/boetticher/identity/ssh
