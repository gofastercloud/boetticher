  version: 1.76.6
  repository: https://pkgs.tailscale.com/stable/debian
  signing_key: https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg
  signing_key_sha256: 3e03dacf222698c60b8e2f990b809ca1b3e104de127767864284e6c228f1fb39
