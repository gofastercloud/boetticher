name: boetticher-aiops
version: 1.0.0
kind: lxc
base: boetticher-base
base_version: 0.4.0
architecture: amd64
runtime:
  adapter: boetticher-aiops
  holmesgpt: 0.40.0
  users:
    - boetticher-aiops
    - holmes
  listeners:
    - tcp://0.0.0.0:443
    - tcp://127.0.0.1:8090
  persistent_state: /var/lib/boetticher/aiops
  transient_evidence: /run/boetticher-aiops
sources:
  holmes_server:
    url: https://github.com/HolmesGPT/holmesgpt/archive/refs/tags/0.40.0.tar.gz
    sha256: 3465cd634b0e478f058b026b37caa3b8f10651f7aa9058dc73368b5403f0fb3d
security:
  internet_toolset: disabled
  bash_toolset: disabled
  kubernetes_toolset: disabled
  remediation: disabled
  mcp: disabled
  ssh_probes: disabled
  holmes_network: loopback-only
qualification:
  - adapter-health
  - holmes-loopback
  - strict-tool-schema
  - structured-inconclusive-output
  - no-direct-egress
