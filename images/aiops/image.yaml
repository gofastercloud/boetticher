name: boetticher-aiops
version: 1.0.0
kind: lxc
base: boetticher-base
base_version: 0.5.0
architecture: amd64
runtime:
  adapter: boetticher-aiops
  holmesgpt: 0.40.0
  users:
    - boetticher-aiops
    - holmes
  listeners:
    - tcp://0.0.0.0:443
    - tcp://127.0.0.1:8090
  persistent_state: /var/lib/boetticher/aiops
  transient_evidence: /run/boetticher-aiops
sources:
  holmes_server:
    url: https://codeload.github.com/HolmesGPT/holmesgpt/tar.gz/3d201559c0f3648a6c567aece09662f4f407bcc9
    sha256: 7016d3335a7f81810de35d9030a63bc38204d94991e3343d6cdbbcaf77a755be
security:
  internet_toolset: disabled
  bash_toolset: disabled
  kubernetes_toolset: disabled
  remediation: disabled
  mcp: disabled
  ssh_probes: disabled
  holmes_network: loopback-only
qualification:
  - adapter-health
  - holmes-loopback
  - strict-tool-schema
  - structured-inconclusive-output
  - no-direct-egress
