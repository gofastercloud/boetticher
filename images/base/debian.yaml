name: boetticher-base
version: 0.3.1
distribution: debian
release: "13"
architecture: amd64
init: systemd
runtime:
  - ca-certificates
  - systemd
  - openssh-client
  - iproute2
  - nftables
  - journald
  - systemd-journal-upload
logging:
  local_system_max_use: 256M
  upload_service: systemd-journal-upload.service
hardening: bounded-systemd
secrets: none
