name: boetticher-base
version: 0.3.30
distribution: debian
release: "13"
architecture: amd64
init: systemd
source:
  mirror: https://snapshot.debian.org/archive/debian/20260327T000000Z/
  snapshot: 20260327T000000Z
build:
  packages:
    - systemd
    - systemd-sysv
    - systemd-journal-remote
    - ca-certificates
    - openssl
    - openssh-server
    - sudo
    - iproute2
    - iputils-ping
    - nftables
    - chrony
    - curl
    - jq
    - bash
    - python3
runtime:
  journal: systemd-journal
  journal_upload: systemd-journal-upload
  ca_trust: ca-certificates
administration:
  user: labadmin
  shell: /bin/bash
  password_authentication: false
first_boot:
  service: boetticher-first-boot.service
  operator_key_path: /run/boetticher/bootstrap/operator.pub
  artifact_identity_path: /usr/lib/boetticher/artifact.json
  runtime_config_path: /etc/boetticher/module.yaml
logging:
  local_system_max_use: 256M
  upload_service: systemd-journal-upload.service
hardening: bounded-systemd
secrets: none
