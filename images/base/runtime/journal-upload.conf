# The collector endpoint and endpoint-local PKI paths are deployment-derived.
# Core writes the active values during deploy and enables journal-upload only
# after those values and certificates are present.
[Upload]
# URL=https://logs.lab.home.arpa:19532
# ServerKeyFile=/var/lib/boetticher/identity/logging/client.key
# ServerCertificateFile=/var/lib/boetticher/identity/logging/client.crt
# TrustedCertificateFile=/var/lib/boetticher/identity/logging/ca.crt
