storage:
  type: sqlite
  path: /var/lib/boetticher/observability/state/gatus/gatus.db
metrics: true
web:
  port: 8080
  host: 127.0.0.1
endpoints:
  - name: victoriametrics
    group: observability
    url: http://127.0.0.1:8428/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
  - name: victorialogs
    group: observability
    url: http://127.0.0.1:9428/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
  - name: grafana
    group: observability
    url: http://127.0.0.1:3000/api/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
  - name: bifrost
    group: observability
    url: http://127.0.0.1:4000/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
  - name: gatus
    group: observability
    url: http://127.0.0.1:8080/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
