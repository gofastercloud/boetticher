---
- name: Require a Debian Proxmox host
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Debian'
      - ansible_facts.distribution_major_version | int >= 12
    fail_msg: "Proxmox host preparation requires a supported Debian-based Proxmox host"

- name: Inspect the known PVE enterprise sources file
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
  register: proxmox_enterprise_sources

- name: Disable the known PVE enterprise source
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list.d/pve-enterprise.sources
    regexp: '^Enabled:'
    line: 'Enabled: no'
    insertafter: EOF
    owner: root
    group: root
    mode: '0644'
  when: proxmox_enterprise_sources.stat.exists

- name: Inspect the known PVE enterprise list file
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/pve-enterprise.list
  register: proxmox_enterprise_list

- name: Disable the known PVE enterprise list entries
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    regexp: '^([[:space:]]*deb[[:space:]].*enterprise\\.proxmox\\.com.*)$'
    replace: '# Disabled by Boetticher: \\1'
    owner: root
    group: root
    mode: '0644'
  when: proxmox_enterprise_list.stat.exists

- name: Configure the signed PVE no-subscription source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/boetticher-pve-no-subscription.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: http://download.proxmox.com/debian/pve
      Suites: {{ proxmox_no_subscription_codename }}
      Components: pve-no-subscription
