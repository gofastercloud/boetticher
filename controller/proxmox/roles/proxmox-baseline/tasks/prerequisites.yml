---
- name: Install Proxmox host prerequisites without upgrading the host
  ansible.builtin.apt:
    name:
      - git
      - rsync
      - openssh-client
      - openssh-server
      - bash
      - bzip2
      - coreutils
      - diffutils
      - file
      - findutils
      - gawk
      - gzip
      - make
      - patch
      - python3
      - python3-apt
      - python3-debian
      - perl
      - sudo
      - tar
      - unzip
      - util-linux
      - wget
      - which
      - xz-utils
      - zstd
    state: present
    update_cache: false
    lock_timeout: 300

- name: Install the Boetticher Host speedtest helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/libexec/boetticher-host-speedtest"
    dest: /usr/local/libexec/boetticher-host-speedtest
    owner: root
    group: root
    mode: '0755'

- name: Install the Boetticher Phase 4A firewall test helper
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/libexec/boetticher-firewall-test-host"
    dest: /usr/local/libexec/boetticher-firewall-test-host
    owner: root
    group: root
    mode: '0755'
