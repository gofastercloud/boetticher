---
- name: Require packaged lab snapshot binaries and documentation
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /opt/boetticher/current/bin/boetticher-labviewer
    - /opt/boetticher/current/bin/boetticher-lab-snapshot
    - /opt/boetticher/current/controller/labviewer/docs/modules.md
    - /opt/boetticher/current/controller/labviewer/docs/lab.md
    - /opt/boetticher/current/controller/labviewer/docs/start.md
  register: labviewer_assets

- name: Validate packaged lab snapshot assets
  ansible.builtin.assert:
    that: labviewer_assets.results | rejectattr('stat.isreg', 'equalto', true) | list | length == 0
    fail_msg: "Lab snapshot portal assets are missing from the active release"

- name: Create lab snapshot state directory
  ansible.builtin.file:
    path: /var/lib/boetticher/labviewer
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create lab snapshot publication directory
  ansible.builtin.file:
    path: /var/lib/boetticher/labviewer/snapshot
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Install lab snapshot units
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/systemd/system/{{ item | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - boetticher-labviewer.service.j2
    - boetticher-lab-snapshot.service.j2
    - boetticher-lab-snapshot.timer.j2

- name: Enable and restart lab snapshot portal
  ansible.builtin.systemd_service:
    name: boetticher-labviewer.service
    enabled: true
    state: restarted
    daemon_reload: true

- name: Enable and start lab snapshot timer
  ansible.builtin.systemd_service:
    name: boetticher-lab-snapshot.timer
    enabled: true
    state: started
    daemon_reload: true
