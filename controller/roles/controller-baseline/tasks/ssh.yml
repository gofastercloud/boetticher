---
- name: Require the configured controller operator
  ansible.builtin.getent:
    database: passwd
    key: "{{ controller_operator_user }}"

- name: Install the owned controller SSH policy
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-boetticher-controller.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
  notify: reload ssh
