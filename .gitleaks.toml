[extend]
useDefault = true

[[allowlists]]
description = "Historical pre-rename command prose is not a credential"
regexTarget = "line"
regexes = ['homelab bootstrap']

[[allowlists]]
description = "The PowerDNS input-pinning commit contains only public repository verification metadata"
commits = ['c27c981845d960146559ad785f576e4e22c391a9']

[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "One historical installation sentence was flagged as a credential despite containing only prose"
    condition = "AND"
    regexTarget = "line"
    regexes = ['credential handoff, VLAN/Kea/firewall API adapters, and generated']
    paths = ['docs/installation\.md']
